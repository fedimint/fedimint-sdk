<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title description">
  <title id="title">Fedimint SDK architecture</title>
  <desc id="description">WalletDirector owns the TransportClient and creates FedimintWallet instances. The wallet exposes domain services that use the shared client. The client wraps the platform transport and owns the logger.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e" />
    </marker>
    <style>
      .node { fill: #20242c; stroke: #8b949e; stroke-width: 2; }
      .primary { fill: #263b68; stroke: #6e9cff; }
      .service { fill: #242a33; stroke: #6e7681; }
      .label { fill: #f0f6fc; font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .edge { fill: none; stroke: #8b949e; stroke-width: 2; marker-end: url(#arrow); }
      .edge-label { fill: #8c95a3; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="node primary" x="430" y="20" width="260" height="64" rx="10" />
  <text class="label" x="560" y="59">WalletDirector</text>

  <rect class="node" x="135" y="165" width="250" height="64" rx="10" />
  <text class="label" x="260" y="204">TransportClient</text>

  <rect class="node primary" x="735" y="165" width="250" height="64" rx="10" />
  <text class="label" x="860" y="204">FedimintWallet</text>

  <rect class="node" x="55" y="320" width="210" height="64" rx="10" />
  <text class="label" x="160" y="359">Platform Transport</text>

  <rect class="node" x="315" y="320" width="160" height="64" rx="10" />
  <text class="label" x="395" y="359">Logger</text>

  <rect class="node primary" x="735" y="320" width="250" height="64" rx="10" />
  <text class="label" x="860" y="359">Wallet Services</text>

  <path class="edge" d="M 495 84 C 460 120, 365 135, 315 165" />
  <text class="edge-label" x="404" y="126">owns</text>

  <path class="edge" d="M 625 84 C 660 120, 755 135, 805 165" />
  <text class="edge-label" x="716" y="126">creates</text>

  <path class="edge" d="M 735 197 L 386 197" />
  <text class="edge-label" x="560" y="185">uses</text>

  <path class="edge" d="M 860 229 L 860 320" />
  <text class="edge-label" x="895" y="280">provides</text>

  <path class="edge" d="M 225 229 C 210 270, 185 290, 170 320" />
  <text class="edge-label" x="177" y="278">wraps</text>

  <path class="edge" d="M 295 229 C 320 270, 365 290, 385 320" />
  <text class="edge-label" x="353" y="278">owns</text>

  <path class="edge" stroke-dasharray="7 6" d="M 735 350 C 630 350, 555 245, 386 213" />
  <text class="edge-label" x="580" y="310">use shared client</text>

  <path class="edge" d="M 860 384 L 860 430 L 100 430 L 100 500" />
  <path class="edge" d="M 860 384 L 860 430 L 284 430 L 284 500" />
  <path class="edge" d="M 860 384 L 860 430 L 468 430 L 468 500" />
  <path class="edge" d="M 860 384 L 860 430 L 652 430 L 652 500" />
  <path class="edge" d="M 860 384 L 860 430 L 836 430 L 836 500" />
  <path class="edge" d="M 860 384 L 860 430 L 1020 430 L 1020 500" />

  <rect class="node service" x="20" y="500" width="160" height="58" rx="9" />
  <text class="label" x="100" y="536">BalanceService</text>

  <rect class="node service" x="204" y="500" width="160" height="58" rx="9" />
  <text class="label" x="284" y="536">MintService</text>

  <rect class="node service" x="388" y="500" width="160" height="58" rx="9" />
  <text class="label" x="468" y="536">LightningService</text>

  <rect class="node service" x="572" y="500" width="160" height="58" rx="9" />
  <text class="label" x="652" y="536">FederationService</text>

  <rect class="node service" x="756" y="500" width="160" height="58" rx="9" />
  <text class="label" x="836" y="536">RecoveryService</text>

  <rect class="node service" x="940" y="500" width="160" height="58" rx="9" />
  <text class="label" x="1020" y="536">WalletService</text>
</svg>
