rust:
  directory: ../../
  manifestPath: fedimint-sdk-ffi/fedimint-client-uniffi/Cargo.toml

bindings:
  cpp: cpp/generated
  ts: src/generated

android:
  targets:
    - arm64-v8a
    - x86_64
  useSharedLibrary: true

ios:
  tags: [ios]
  targets:
    - aarch64-apple-ios
    - x86_64-apple-ios
  frameworks:
    - SystemConfiguration
    - Security