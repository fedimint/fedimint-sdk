name: Setup Nix
description: Sets up nix for running tests with devimint

inputs:
  cachix_auth_token:
    description: 'Cachix authentication token'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-25.11
        extra_nix_config: |
          connect-timeout = 15
          stalled-download-timeout = 15

    - name: Setup Cachix
      uses: cachix/cachix-action@v17
      with:
        name: fedimint
        authToken: ${{ inputs.cachix_auth_token }}
      continue-on-error: true

    - name: Recheck what Cachix has after an hour
      # Nix trusts for 30 days that a cache has a path, and under which file name. Cachix
      # garbage-collects, so on a runner that keeps its Nix state the file can be gone: Nix then
      # builds the path from source, even when Cachix has it again under a new name.
      shell: bash
      run: |
        conf="${XDG_CONFIG_HOME:-$HOME/.config}/nix/nix.conf"
        line='narinfo-cache-positive-ttl = 3600'
        mkdir -p "$(dirname "$conf")"
        grep -qxF "$line" "$conf" 2>/dev/null || echo "$line" >> "$conf"

    - name: Expose fedimint ref, Node, PNPM from dev shell
      shell: bash
      run: |
        nix develop --accept-flake-config --command bash << 'EOF'
          echo "FEDIMINT_REF=${{ env.FEDIMINT_REF }}" >> $GITHUB_ENV

          NODE_BIN_DIR=$(dirname "$(which node)")
          PNPM_BIN_DIR=$(dirname "$(which pnpm)")

          echo "$NODE_BIN_DIR"  >> $GITHUB_PATH
          echo "$PNPM_BIN_DIR" >> $GITHUB_PATH
        EOF
