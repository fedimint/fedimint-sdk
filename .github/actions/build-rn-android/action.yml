name: Build Android RN
description: Builds Android React Native bindings using Nix-cached Rust derivations
outputs:
  sha256:
    description: 'SHA256 of the android-artifacts.zip'
    value: ${{ steps.compress.outputs.sha256 }}
runs:
  using: composite
  steps:
    - name: Build Android via Nix
      # `just build-android` runs `nix build .#android-<triple>` (cachix-cached
      # Rust artifacts) and then `ubrn build android --no-cargo --and-generate
      # --release` to do only the bindings/JNI-libs assembly. No cargo
      # cross-compile happens on the runner if the cache is warm.
      shell: bash
      run: nix develop --accept-flake-config -c just build-android

    - name: Push FFI libs to Cachix
      # The self-hosted runner keeps a persistent /nix/store, so cachix-action's
      # post-run hook (which only pushes newly *built* paths) stops pushing once
      # the store is warm and the cache entries can expire. Push the lib outputs
      # explicitly so `just build-android` elsewhere substitutes them instead of
      # cross-compiling the whole dependency tree from source.
      shell: bash
      continue-on-error: true
      run: |
        nix build --accept-flake-config --no-link --print-out-paths \
          .#android-aarch64-linux-android .#android-x86_64-linux-android \
          | cachix push fedimint

    - name: Compress Android binaries
      id: compress
      shell: bash
      working-directory: packages/react-native-bindings
      run: |
        nix develop --accept-flake-config ../../ -c zip -9 -r android-artifacts.zip android/src/main/jniLibs
        ANDROID_SHA256=$(sha256sum android-artifacts.zip | cut -d' ' -f1)
        ANDROID_SIZE=$(du -h android-artifacts.zip | cut -f1)
        echo "sha256=$ANDROID_SHA256" >> $GITHUB_OUTPUT
        echo "ANDROID_SHA256=$ANDROID_SHA256" >> $GITHUB_ENV
        echo "### Android Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- Size: $ANDROID_SIZE" >> $GITHUB_STEP_SUMMARY
        echo "- SHA256: $ANDROID_SHA256" >> $GITHUB_STEP_SUMMARY

    - name: Upload Generated Bindings
      uses: actions/upload-artifact@v4
      with:
        name: generated-bindings-android
        path: |
          packages/react-native-bindings/src
          packages/react-native-bindings/lib
          packages/react-native-bindings/cpp
          packages/react-native-bindings/android
          packages/react-native-bindings/android-artifacts.zip
        if-no-files-found: error
