name: Android E2E (Appium)

on:
  # Fires when "React Native Verify" (react-native-pr.yml) finishes — that
  # workflow already gates on the same react-native/nix/workflows paths this
  # needs, and its `build-android` job builds the exact native bindings
  # (fedimint-client-uniffi cross-compiled for Android + generated Kotlin/JS
  # glue) this workflow needs. Rather than rebuild them a second time here,
  # download that job's `generated-bindings-android` artifact.
  #
  # Caveat: workflow_run triggers off the workflow FILE on the default
  # branch, so this won't fire for the PR that first introduces it — only
  # from the next PR onward, once merged. It also gates on the *whole*
  # upstream workflow's conclusion (e.g. build-android succeeding but
  # test-transport failing still counts as failure), since GitHub Actions
  # has no native "wait for one job in another workflow" trigger.
  workflow_run:
    workflows: ['React Native Verify']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # to download the artifact from the triggering workflow_run

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true

jobs:
  android-e2e:
    name: Android E2E
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    # No devimint/faucet dependency yet (the v1 mnemonic test is local-only),
    # so this doesn't join the shared `devimint-tests` concurrency group from
    # verify.yml. The moment a federation-touching test is added here, it
    # will race the wasm job and other PRs' runs of this workflow for
    # devimint's fixed faucet port (see issue #340) — reconsider concurrency
    # then, either joining that group (accepting serialization) or waiting on
    # a dynamic-port fix upstream.

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Download prebuilt Android bindings
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: generated-bindings-android
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install deps & build the react-native JS wrapper
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        env:
          # The downloaded artifact already placed real jniLibs at
          # js/react-native/react-native-bindings/android/src/main/jniLibs, so skip
          # react-native-bindings' postinstall (scripts/download-binaries.js),
          # which would otherwise try to fetch a previously-published release
          # instead of using what we just downloaded from this PR's own build.
          FEDIMINT_SKIP_BINARY_DOWNLOAD: 'true'
        run: |
          nix develop --accept-flake-config -c bash << 'EOF'
            set -euo pipefail
            pnpm --dir js install --frozen-lockfile
            pnpm --dir js run build:reactnative
          EOF

      - name: Run Android E2E tests
        shell: bash
        env:
          TESTS_TO_RUN: all
          # Bindings are already in place from the artifact download above;
          # only build them from source here for a manual workflow_dispatch
          # run, which has no upstream workflow_run to pull them from.
          SKIP_BINDINGS_BUILD: ${{ github.event_name == 'workflow_run' && 'true' || '' }}
        run: |
          nix develop --accept-flake-config .#android-tests --command bash << 'EOF'
            set -euo pipefail
            bash scripts/e2e-android/run-android-e2e.sh
          EOF

      - name: Upload logs & screenshots
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: android-e2e-logs
          include-hidden-files: true
          path: |
            js/react-native/integration-tests-android/.appium/*.log
            js/react-native/integration-tests-android/screenshots/*
