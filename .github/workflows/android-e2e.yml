name: Android E2E (Appium)

# Runs the Android demo app (android/app) on an emulator and drives it with
# Appium, so the generated Kotlin bindings and the native library behind them
# are exercised at runtime — kotlin-sdk.yaml's `kotlin` job only proves they
# compile.
#
# Called by kotlin-sdk.yaml rather than triggered on `pull_request` of its
# own, for the reason android-native.yaml spells out: this needs the same
# cross-compiled `.so` that workflow builds, and a second PR entry point over
# the same paths would mean two cross-compiles of one commit in two runs that
# cannot cancel each other. The caller passes the artifact its `native` job
# produced; on `workflow_dispatch` there is no caller, so the run builds the
# payload itself (from Cachix, in practice) instead.

on:
  workflow_call:
    inputs:
      jni-artifact:
        description: 'Name of the jniLibs artifact built by android-native.yaml'
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-e2e:
    name: Android E2E
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # No devimint/faucet dependency yet (both tests are local-only), so this
    # doesn't join the shared `devimint-tests` concurrency group from
    # verify.yml. The moment a federation-touching test is added here, it
    # will race the wasm job and other PRs' runs of this workflow for
    # devimint's fixed faucet port (see issue #340) — reconsider concurrency
    # then, either joining that group (accepting serialization) or waiting on
    # a dynamic-port fix upstream.

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # GitHub-hosted Ubuntu runners have /dev/kvm but it isn't
      # world-accessible by default; without this the emulator falls back to
      # (very slow) software virtualization. Standard reactivecircus/
      # android-emulator-runner incantation.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # jniLibs is a build output and gitignored, so it has to be put back
      # before either uniffi-bindgen or Gradle can see it.
      - name: Download jniLibs
        if: ${{ inputs.jni-artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.jni-artifact }}
          path: android/fedimint-sdk/src/main/jniLibs/

      # Generated from the `.so` downloaded above rather than from the crate
      # source, so the Kotlin driven on the device cannot drift from the
      # library it loads. `rust/uniffi-bindgen`'s only dependency is `uniffi`
      # itself — a small host build, no NDK and no Nix (see the script).
      - name: Set up Rust
        if: ${{ inputs.jni-artifact != '' }}
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Generate the Kotlin bindings
        if: ${{ inputs.jni-artifact != '' }}
        run: ./scripts/generate-kotlin-bindings.sh

      - name: Install workspace deps
        shell: bash
        env:
          FEDIMINT_SKIP_BINARY_DOWNLOAD: 'true'
        run: |
          nix develop --accept-flake-config -c bash << 'EOF'
            set -euo pipefail
            pnpm --dir js install --frozen-lockfile
          EOF

      - name: Run Android E2E tests
        shell: bash
        env:
          TESTS_TO_RUN: all
          # With an artifact, both halves of the SDK payload are already in
          # place from the steps above and run-android-e2e.sh skips its own
          # build-android-sdk.sh call; on a dispatch run it does that build.
          SKIP_BINDINGS_BUILD: ${{ inputs.jni-artifact != '' }}
        run: |
          nix develop --accept-flake-config .#android-tests --command bash << 'EOF'
            set -euo pipefail
            bash scripts/e2e-android/run-android-e2e.sh
          EOF

      - name: Upload logs & screenshots
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: android-e2e-logs
          include-hidden-files: true
          path: |
            js/android/integration-tests/.appium/*.log
            js/android/integration-tests/screenshots/*
