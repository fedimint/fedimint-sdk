name: Swift SDK

# Cross-compiles `rust/fedimint-sdk`'s `uniffi` feature for Apple targets,
# generates the Swift bindings from the built library, and proves the whole
# chain: the package's tests, and the demo app compiled against the freshly
# generated bindings.
#
# Two workflows, the same shape as Android's. An earlier version of this file
# argued the opposite — that because every Apple target compiles against an SDK
# shipping inside Xcode, which cannot live in the nix store, there was "no
# derivation to cache". The premise is true and the conclusion does not follow:
# a derivation marked `__noChroot` reads the host SDK and still produces an
# ordinary, substitutable store path. fedimint-sdk-ffi had been doing exactly
# that, against this same dependency graph, the whole time.
#
# So the expensive half now lives in ios-native.yaml as cacheable derivations
# pushed to fedimint.cachix.org, and this workflow calls it and does the cheap
# half: bindings, XCFramework, tests, demo. A cold cache degrades to "build it"
# rather than failing, because this calls that workflow rather than depending on
# an artifact having survived.
#
# A pull request starts this workflow whatever it changes. Its first job,
# `changes`, decides from the changed files whether the jobs that build and test
# run. Its last job, `result`, is the one check to require, "Swift SDK checks".
# It passes when `changes` said to run and every other job succeeded, or
# `changes` said not to and every other job was skipped. It fails in every
# other case, a run that is cancelled before those jobs have finished included.

on:
  workflow_dispatch:

  # No `paths` filter: a workflow that does not start reports nothing, and a
  # check that never reports cannot be required. The `changes` job below
  # filters by path instead.
  pull_request:

  # On `main`, build the full four-target set so a complete XCFramework is
  # always available as an artifact, and so the two targets pull requests skip
  # (the device slice and the Intel simulator) cannot rot unnoticed.
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'rust/fedimint-sdk/**'
      - 'rust/uniffi-bindgen/**'
      - 'scripts/build-ios-lib.sh'
      - 'scripts/nix-build-ios-lib.sh'
      - 'scripts/generate-swift-bindings.sh'
      - 'scripts/assemble-ios-xcframework.sh'
      - 'scripts/build-ios-sdk.sh'
      - 'nix/**'
      - '.github/workflows/swift-sdk.yaml'
      - '.github/workflows/ios-native.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# `contents: read` rather than `{}`: this workflow calls another one, and a
# called workflow can never hold more permissions than its caller grants. With
# no permissions at all the call is refused before the callee's jobs are ever
# created — which shows up as this workflow's own job being skipped, with no log
# to read anywhere.
permissions:
  contents: read

jobs:
  # Whether this pull request changes what the jobs below build and test. The
  # answer is `true` for any other event: a manual run, and a push to `main`
  # that has already passed the `paths` filter under `push`. The action tests
  # its matcher before it answers, and a matcher that fails fails this job, and
  # with it `result`.
  changes:
    name: 'Detect Swift SDK changes'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changed.outputs.changed }}

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 'Match the changed files against what this workflow checks'
        id: changed
        uses: ./.github/actions/changed-paths
        with:
          # `*` also matches `/`.
          patterns: |
            ios/*
            rust/fedimint-sdk/*
            rust/uniffi-bindgen/*
            scripts/build-ios-lib.sh
            scripts/nix-build-ios-lib.sh
            scripts/generate-swift-bindings.sh
            scripts/assemble-ios-xcframework.sh
            scripts/build-ios-sdk.sh
            nix/*
            flake.nix
            flake.lock
            .github/workflows/swift-sdk.yaml
            .github/workflows/ios-native.yaml

  # The shared, expensive half. Builds nothing Swift-specific and uploads the
  # per-triple archives for the job below.
  native:
    name: 'Native libraries'
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/ios-native.yaml
    secrets: inherit

  swift:
    needs: native
    name: 'Generate the bindings, assemble the XCFramework, test + compile the demo'
    # Still a macOS runner: xcodebuild -create-xcframework, swift test and the
    # demo build all need Xcode. The heavy cross-compile is no longer here.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The archives and their manifest are build outputs and gitignored, so
      # they have to be put back before uniffi-bindgen or the XCFramework
      # assembly can see them. Restored to the exact paths the local
      # plain-cargo producer writes, so the scripts below need no special case.
      - name: 'Download the Apple slices'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.native.outputs.slices-artifact }}
          path: rust/fedimint-sdk/target/

      # Only `rust/uniffi-bindgen` is built here now — a small host build whose
      # single dependency is uniffi itself. No Apple targets: the cross-compile
      # belongs to the `native` job.
      - name: 'Set up Rust'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: rust/uniffi-bindgen

      - name: 'Install xcodegen'
        # Generates ios/Demo/FedimintDemo.xcodeproj from the committed
        # project.yml. cmake, perl and go are already on the runner image.
        run: brew install xcodegen

      # The `native` job builds all four slices, so there is no IOS_TARGETS
      # subset here any more — the expensive half is cached, and halving it
      # bought nothing once it stopped running on this runner. The manifest that
      # came down with the artifact is what decides which slices get assembled.
      - name: 'Generate the Swift bindings + assemble the XCFramework'
        run: |
          ./scripts/generate-swift-bindings.sh
          ./scripts/assemble-ios-xcframework.sh

      - name: 'Upload the generated Swift bindings'
        uses: actions/upload-artifact@v4
        with:
          name: swift-bindings
          path: ios/Sources/FedimintSdk/FedimintSdk.swift
          if-no-files-found: error

      # Runs against the macos-arm64 slice, so no simulator has to be booted.
      - name: 'Run the package tests'
        run: swift test --package-path ios

      # The demo app is the reason this step is here: compiling it is what
      # proves the generated bindings are usable from ordinary Swift, not merely
      # that they parse. The exact role :app:assembleDebug plays in
      # android-sdk.yaml.
      # No ARCHS override any more. That existed because a pull request built
      # only the arm64 simulator slice, so a generic destination — which builds
      # every standard simulator architecture — failed to link x86_64. The
      # native job now always produces both, so the lipo'd slice satisfies the
      # generic destination on every trigger.
      - name: 'Compile the demo app for the simulator'
        working-directory: ios/Demo
        run: |
          xcodegen generate
          xcodebuild build \
            -project FedimintDemo.xcodeproj \
            -scheme FedimintDemo \
            -destination 'generic/platform=iOS Simulator'

      - name: 'Upload the XCFramework'
        uses: actions/upload-artifact@v4
        with:
          name: FedimintSdkFFI.xcframework
          path: ios/Frameworks/FedimintSdkFFI.xcframework/
          if-no-files-found: error

  # The one check to require. It passes only if `changes` answered `true` and
  # every other job it needs succeeded, or `changes` answered `false` (the pull
  # request touches nothing this workflow checks) and every other job it needs
  # was skipped. Anything else fails it.
  #
  # A skipped job is not accepted when `changes` answered `true`: GitHub skips
  # a job when a job it needs did not succeed, and also shows the call of a
  # refused reusable workflow as skipped, and branch protection counts a
  # skipped check as passed. Both jobs are watched, so that the error names the
  # one that broke it, `native` when it is the reason `swift` was skipped.
  #
  # `always()` makes the job start in a cancelled run too, where it sees the
  # cancelled jobs and fails. Without it the check would end as whatever
  # GitHub reports for a job that never started. That is `cancelled` today,
  # which does not pass either, but no documentation promises it. The run of a
  # commit that a newer commit replaced fails this way on the old commit only,
  # where it decides nothing.
  #
  # What the check is worth depends on its `needs`. A job of this workflow
  # that is not listed there decides nothing, and one that is listed with
  # `continue-on-error: true` reads as succeeded when it fails. A listed job
  # with an `if:` of its own is skipped when the condition is false, and this
  # check then fails whenever `changes` answered `true`.
  result:
    name: 'Swift SDK checks'
    needs: [changes, native, swift]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      # The repository is only needed to read the local action below.
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Check that every job ended as it has to'
        uses: ./.github/actions/jobs-result
        with:
          needs: ${{ toJSON(needs) }}
          ran: ${{ needs.changes.outputs.run }}
