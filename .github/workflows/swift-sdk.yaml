name: Swift SDK

# Cross-compiles `rust/fedimint-sdk`'s `uniffi` feature for Apple targets,
# generates the Swift bindings from the built library, and proves the whole
# chain: the package's tests, and the demo app compiled against the freshly
# generated bindings.
#
# Deliberately one workflow, where Android is two. The Android split exists
# because its `.so` is a Nix derivation: android-native.yaml builds it on a
# self-hosted runner with a warm /nix/store, pushes it to Cachix and uploads it
# so any binding generator can read the artifact instead of rebuilding. None of
# that applies here. Every Apple target compiles against an SDK that ships
# inside Xcode and cannot live in the nix store, so scripts/build-ios-lib.sh is
# plain cargo, there is no derivation to cache, and a separate `workflow_call`
# native job would buy nothing while costing a second macOS runner — the most
# expensive kind. The cargo cache below plays the role Cachix plays there.

on:
  workflow_dispatch:

  pull_request:
    paths:
      - 'ios/**'
      - 'rust/fedimint-sdk/**'
      - 'rust/uniffi-bindgen/**'
      - 'scripts/build-ios-lib.sh'
      - 'scripts/generate-swift-bindings.sh'
      - 'scripts/build-ios-sdk.sh'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/swift-sdk.yaml'

  # On `main`, build the full four-target set so a complete XCFramework is
  # always available as an artifact, and so the two targets pull requests skip
  # (the device slice and the Intel simulator) cannot rot unnoticed.
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'rust/fedimint-sdk/**'
      - 'rust/uniffi-bindgen/**'
      - 'scripts/build-ios-lib.sh'
      - 'scripts/generate-swift-bindings.sh'
      - 'scripts/build-ios-sdk.sh'
      - '.github/workflows/swift-sdk.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift:
    name: 'Build the XCFramework, generate the bindings, test + compile the demo'
    # Apple Silicon. The macOS SDK it ships is what every slice here compiles
    # against, so this cannot move to a Linux runner, Nix or not.
    runs-on: macos-15
    # A cold build compiles rocksdb and aws-lc from C once per target. The cache
    # below usually avoids that; this is the ceiling for when it does not, and
    # matches android-native.yaml's.
    timeout-minutes: 120

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No Nix here. `.#ios` exists for local work — it supplies the Apple Rust
      # targets and the C build tools a developer's machine may not have — but a
      # macOS runner already has cmake, perl, go and Xcode, and installing Nix
      # to reach a shell with no cacheable outputs would only add minutes.
      - name: 'Set up Rust'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin,aarch64-apple-ios-sim,aarch64-apple-ios,x86_64-apple-ios
          # This is the whole reason the job fits in its timeout: the expensive
          # half is aws-lc's and rocksdb's C sources, and they are cached per
          # target alongside the Rust. Both crates are listed for the same
          # reason rust-sdk-ci.yaml lists them — this is a workspace of
          # workspaces, so neither is found from the repo root.
          cache-workspaces: |
            rust/fedimint-sdk
            rust/uniffi-bindgen

      - name: 'Install xcodegen'
        # Generates ios/Demo/FedimintDemo.xcodeproj from the committed
        # project.yml. cmake, perl and go are already on the runner image.
        run: brew install xcodegen

      # Two targets on a pull request rather than four: the macOS slice is what
      # `swift test` runs against and the simulator slice is what the demo
      # compiles against, so this covers every check below while halving the
      # cross-compile. The device and Intel-simulator slices are built on `main`
      # and on demand. Same cost-control knob, same reasoning, as IOS_TARGETS in
      # js/react-native/react-native-bindings/scripts/nix-prebuild.sh.
      - name: 'Build the XCFramework + generate the Swift bindings'
        env:
          IOS_TARGETS: >-
            ${{ github.event_name == 'pull_request'
                && 'aarch64-apple-darwin aarch64-apple-ios-sim'
                || 'aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin' }}
        run: ./scripts/build-ios-sdk.sh

      - name: 'Upload the generated Swift bindings'
        uses: actions/upload-artifact@v4
        with:
          name: swift-bindings
          path: ios/Sources/FedimintSdk/FedimintSdk.swift
          if-no-files-found: error

      # Runs against the macos-arm64 slice, so no simulator has to be booted.
      - name: 'Run the package tests'
        run: swift test --package-path ios

      # The demo app is the reason this step is here: compiling it is what
      # proves the generated bindings are usable from ordinary Swift, not merely
      # that they parse. The exact role :app:assembleDebug plays in
      # kotlin-sdk.yaml.
      # `generic/platform=iOS Simulator` builds every standard simulator
      # architecture, so ARCHS has to match the slices that were actually built
      # above or the link fails on the missing one. On a pull request that is
      # arm64 only; on main the x86_64 simulator target is built too and the
      # lipo'd slice covers both.
      - name: 'Compile the demo app for the simulator'
        working-directory: ios/Demo
        env:
          DEMO_ARCHS: >-
            ${{ github.event_name == 'pull_request' && 'arm64' || '$(ARCHS_STANDARD)' }}
        run: |
          xcodegen generate
          xcodebuild build \
            -project FedimintDemo.xcodeproj \
            -scheme FedimintDemo \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS="$DEMO_ARCHS"

      - name: 'Upload the XCFramework'
        uses: actions/upload-artifact@v4
        with:
          name: FedimintSdkFFI.xcframework
          path: ios/Frameworks/FedimintSdkFFI.xcframework/
          if-no-files-found: error
