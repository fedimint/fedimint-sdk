name: Swift SDK

# Cross-compiles `rust/fedimint-sdk`'s `uniffi` feature for Apple targets,
# generates the Swift bindings from the built library, and proves the whole
# chain: the package's tests, and the demo app compiled against the freshly
# generated bindings.
#
# Two workflows, the same shape as Android's. An earlier version of this file
# argued the opposite — that because every Apple target compiles against an SDK
# shipping inside Xcode, which cannot live in the nix store, there was "no
# derivation to cache". The premise is true and the conclusion does not follow:
# a derivation marked `__noChroot` reads the host SDK and still produces an
# ordinary, substitutable store path. fedimint-sdk-ffi had been doing exactly
# that, against this same dependency graph, the whole time.
#
# So the expensive half now lives in ios-native.yaml as cacheable derivations
# pushed to fedimint.cachix.org, and this workflow calls it and does the cheap
# half: bindings, XCFramework, tests, demo. A cold cache degrades to "build it"
# rather than failing, because this calls that workflow rather than depending on
# an artifact having survived.

on:
  workflow_dispatch:

  # No `paths:` filter. Branch protection requires `result`, and a workflow a
  # filter never started leaves a required check waiting forever, so this one
  # starts on every pull request and the `changes` job holds the path list.
  pull_request:

  # The merge queue's run: main plus the PRs queued ahead, tested before main
  # moves. It builds when the merge group touches the path list in `changes`.
  #
  # No `push` trigger. When a queue build passes, main moves to the commit it
  # built, so building again on the push would only repeat it, and the queue's
  # `native` run has already refilled Cachix with that commit's Apple slices.
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# `contents: read` rather than `{}`: this workflow calls another one, and a
# called workflow can never hold more permissions than its caller grants. With
# no permissions at all the call is refused before the callee's jobs are ever
# created — which shows up as this workflow's own job being skipped, with no log
# to read anywhere.
permissions:
  contents: read

jobs:
  # Decides whether this run builds. A pull request or a merge group builds when
  # its diff touches the path list below. Every other event builds: a manual
  # run, or a workflow calling this one.
  changes:
    name: 'Detect changes'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.filter.outputs.swift }}

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The pull-request comparison needs the merge base as well as both
          # endpoint commits, so keep the complete history.
          fetch-depth: 0

      - name: 'Detect changed paths'
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              diff_args=("$PR_BASE_SHA...$PR_HEAD_SHA")
              ;;
            merge_group)
              diff_args=("$MERGE_GROUP_BASE_SHA" "$MERGE_GROUP_HEAD_SHA")
              ;;
            # A manual run, or a workflow calling this one.
            *)
              echo "swift=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          # Do not let Git collapse a rename into its destination path. Treating
          # it as a deletion plus an addition keeps both sides covered.
          changed_files="$RUNNER_TEMP/changed-files"
          if ! git diff --no-renames --name-only -z "${diff_args[@]}" > "$changed_files"; then
            echo "Could not determine changed paths; building." >&2
            echo "swift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          swift=false
          while IFS= read -r -d '' path; do
            case "$path" in
              # Everything the Apple slices, the bindings, the XCFramework, the
              # tests and the demo are built from, and the workflows that build
              # them. The flake is here because the slices are Nix derivations.
              ios/*|rust/fedimint-sdk/*|rust/uniffi-bindgen/*|nix/*|flake.nix|flake.lock|scripts/build-ios-lib.sh|scripts/nix-build-ios-lib.sh|scripts/generate-swift-bindings.sh|scripts/assemble-ios-xcframework.sh|scripts/hide-ios-symbols.sh|scripts/build-ios-sdk.sh|.github/workflows/swift-sdk.yaml|.github/workflows/ios-native.yaml)
                swift=true
                ;;
            esac
          done < "$changed_files"

          echo "swift=$swift" >> "$GITHUB_OUTPUT"

  # The shared, expensive half. Builds nothing Swift-specific and uploads the
  # per-triple archives for the job below.
  native:
    name: 'Native libraries'
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    uses: ./.github/workflows/ios-native.yaml
    secrets: inherit

  swift:
    needs: native
    name: 'Generate the bindings, assemble the XCFramework, test + compile the demo'
    # Still a macOS runner: xcodebuild -create-xcframework, swift test and the
    # demo build all need Xcode. The heavy cross-compile is no longer here.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The archives and their manifest are build outputs and gitignored, so
      # they have to be put back before uniffi-bindgen or the XCFramework
      # assembly can see them. Restored to the exact paths the local
      # plain-cargo producer writes, so the scripts below need no special case.
      - name: 'Download the Apple slices'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.native.outputs.slices-artifact }}
          path: rust/fedimint-sdk/target/

      # Only `rust/uniffi-bindgen` is built here now — a small host build whose
      # single dependency is uniffi itself. No Apple targets: the cross-compile
      # belongs to the `native` job.
      - name: 'Set up Rust'
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: rust/uniffi-bindgen

      - name: 'Install xcodegen'
        # Generates ios/Demo/FedimintDemo.xcodeproj from the committed
        # project.yml. cmake, perl and go are already on the runner image.
        run: brew install xcodegen

      # The `native` job builds all four slices, so there is no IOS_TARGETS
      # subset here any more — the expensive half is cached, and halving it
      # bought nothing once it stopped running on this runner. The manifest that
      # came down with the artifact is what decides which slices get assembled.
      - name: 'Generate the Swift bindings + assemble the XCFramework'
        run: |
          ./scripts/generate-swift-bindings.sh
          ./scripts/assemble-ios-xcframework.sh

      - name: 'Upload the generated Swift bindings'
        uses: actions/upload-artifact@v7
        with:
          name: swift-bindings
          path: ios/Sources/FedimintSdk/FedimintSdk.swift
          if-no-files-found: error

      # Runs against the macos-arm64 slice, so no simulator has to be booted.
      - name: 'Run the package tests'
        run: swift test --package-path ios

      # The demo app is the reason this step is here: compiling it is what
      # proves the generated bindings are usable from ordinary Swift, not merely
      # that they parse. The exact role :app:assembleDebug plays in
      # android-sdk.yaml.
      # No ARCHS override any more. That existed because a pull request built
      # only the arm64 simulator slice, so a generic destination — which builds
      # every standard simulator architecture — failed to link x86_64. The
      # native job now always produces both, so the lipo'd slice satisfies the
      # generic destination on every trigger.
      - name: 'Compile the demo app for the simulator'
        working-directory: ios/Demo
        run: |
          xcodegen generate
          xcodebuild build \
            -project FedimintDemo.xcodeproj \
            -scheme FedimintDemo \
            -destination 'generic/platform=iOS Simulator'

      - name: 'Upload the XCFramework'
        uses: actions/upload-artifact@v7
        with:
          name: FedimintSdkFFI.xcframework
          path: ios/Frameworks/FedimintSdkFFI.xcframework/
          if-no-files-found: error

  # The one check branch protection requires from this workflow. It runs on
  # every pull request and merge group whatever they touched, so the check
  # always reports: a job `changes` skipped counts as a pass, one that failed
  # or was cancelled does not. `always()` rather than `!cancelled()`, so a
  # cancelled run reports a failure instead of a skip that would read as a pass.
  result:
    name: 'Swift SDK result'
    needs: [changes, native, swift]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: 'Check every Swift job passed or was skipped'
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [[ -n "$failed" ]]; then
            echo "$failed" >&2
            exit 1
          fi
