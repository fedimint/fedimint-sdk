name: Changesets

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  changesets:
    name: Publish Changesets
    needs: verify
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: macos-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build WASM
        uses: ./.github/actions/build-wasm
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install and build packages
        run: |
          nix develop --accept-flake-config --command bash << 'EOF'
            pnpm --dir js install
            pnpm --dir js build
          EOF

      # changesets/action@v2 no longer writes ~/.npmrc from NPM_TOKEN, so the
      # publish script below authenticates through this shared user config.
      - name: Configure npm authentication
        run: npm config set "//registry.npmjs.org/:_authToken" "$NPM_TOKEN"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: PR or Publish to NPM
        id: changesets
        uses: changesets/action@v2
        timeout-minutes: 10
        with:
          # package.json and .changeset/ live in the workspace root. The publish
          # command inherits this cwd, hence the flake ref one level up.
          cwd: js
          # v2 renamed `publish` -> `publish-script` and
          # `createGithubReleases` -> `create-github-releases`. push-git-tags now
          # defaults to true even when releases are off, so pin it to main to keep
          # feature-branch workflow_dispatch runs from tagging real versions.
          publish-script: nix develop --accept-flake-config .. -c bash -c "export CI=true; pnpm changeset publish"
          create-github-releases: ${{ github.ref == 'refs/heads/main' }}
          push-git-tags: ${{ github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish prerelease
        # Only publish a prerelease if we didn't publish a release
        if: steps.changesets.outputs.published != 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          nix develop --accept-flake-config -c bash -c '
            export CI=true
            npm config set "//registry.npmjs.org/:_authToken" "$NPM_TOKEN"
            git reset --hard origin/main
            pnpm --dir js clean
            pnpm --dir js changeset version --no-git-tag --snapshot canary
            pnpm --dir js build
            pnpm --dir js changeset publish --no-git-tag --snapshot canary --tag canary
          '
