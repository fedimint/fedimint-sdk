name: Kotlin SDK Snapshot

# Publishes org.fedimint:fedimint-sdk:<branch>-SNAPSHOT to Central's snapshots
# repository. main publishes on every change to what the SDK is built from.
# Any other branch publishes when this workflow is run by hand from it.
#
# This is not part of the release cycle (kotlin-sdk-release.yaml). The version
# is the branch name, whatever the catalog's `fedimintSdk` says, so it never
# has to be bumped. Characters Maven cannot take become `-`, so `feat/x`
# publishes `feat-x-SNAPSHOT`. Each run overwrites its branch's snapshot, and
# Central deletes old snapshots after about 90 days. To use one:
#
#   repositories { maven("https://central.sonatype.com/repository/maven-snapshots/") }
#   implementation("org.fedimint:fedimint-sdk:main-SNAPSHOT")
#
# Like a release, it publishes only what `chain` (the whole of kotlin-sdk.yaml,
# emulator run included) built and tested on this commit. Nothing is signed,
# because Central does not require it for snapshots, so only the Central
# Portal token is needed. Keep MAVEN_CENTRAL_USERNAME and
# MAVEN_CENTRAL_PASSWORD as repository secrets. This job does not use the
# `maven-central` environment, so reviewers required there do not hold up
# every merge.
#
# Snapshots must be enabled for the org.fedimint namespace on
# central.sonatype.com, or the upload is refused.

on:
  # From any branch. That branch's name is the version.
  workflow_dispatch:
  push:
    branches: [main]
    # What the AAR is built from, the same set kotlin-sdk.yaml runs for on a PR.
    paths:
      - 'android/fedimint-sdk/**'
      - 'android/gradle/**'
      - 'android/*.gradle.kts'
      - 'android/gradle.properties'
      - 'rust/fedimint-sdk/**'
      - 'rust/uniffi-bindgen/**'
      - 'nix/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'scripts/nix-build-android-so.sh'
      - 'scripts/generate-kotlin-bindings.sh'
      - '.github/workflows/kotlin-sdk-snapshot.yaml'
      - '.github/workflows/kotlin-sdk.yaml'
      - '.github/workflows/android-native.yaml'

# One run per branch at a time, since each branch has one snapshot. A newer
# push replaces a queued run rather than cancelling one partway through its
# upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  chain:
    name: 'Build and test'
    # A tag has its own release; snapshots are for branches.
    if: github.ref_type == 'branch'
    uses: ./.github/workflows/kotlin-sdk.yaml
    secrets: inherit

  publish:
    name: 'Publish the snapshot'
    needs: chain
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Both are build outputs and gitignored, so both are put back from what
      # `chain` produced and tested.
      - name: 'Download jniLibs'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.chain.outputs.jni-artifact }}
          path: android/fedimint-sdk/src/main/jniLibs/

      - name: 'Download the Kotlin bindings'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.chain.outputs.bindings-artifact }}
          path: android/fedimint-sdk/src/main/java/org/fedimint/sdk/

      - name: 'Set up JDK'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 'Set up Gradle'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: 'Publish to the snapshots repository'
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          # A branch name may hold `/` and other characters a Maven version
          # (and so a repository path) cannot.
          name="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          echo "Publishing org.fedimint:fedimint-sdk:$name-SNAPSHOT"
          ./gradlew :fedimint-sdk:publishToMavenCentral -Psnapshot="$name"
