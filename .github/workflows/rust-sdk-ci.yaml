name: Rust SDK Continuous Integration

# Continuous integration for the fedimint-sdk crate.
# Builds, tests, and runs clippy linting, rustfmt, doc, and wasm-target checks
# on the Rust code.
# Ensures code formatting follows project standards using rustfmt.
# Runs on changes to the rust/fedimint-sdk directory on pushes and pull requests.
#
# This crate has its own workflow file rather than being matrixed into
# rust-ci.yaml: GitHub Actions path filters are workflow-level, so folding it
# in there would build the unrelated fedimint-client-uniffi crate on every
# sdk-only change (and vice versa), and disambiguating the shared job names
# would silently unmatch any branch-protection rule pinned to rust-ci.yaml's
# existing check contexts. A separate file keeps those names stable and lets
# each crate be path-filtered independently.

on:
  push:
    branches: [main]
    paths:
      - 'rust/fedimint-sdk/**'
      - '.github/workflows/rust-sdk-ci.yaml'
      # The crate pins the same fedimint revision the flake does, so a flake
      # bump has to re-run this workflow: pins-agree below checks flake.nix
      # and flake.lock against the crate's pin, and catches a bump that
      # moved one of the three and not the others.
      - 'flake.nix'
      - 'flake.lock'
  pull_request:
    paths:
      - 'rust/fedimint-sdk/**'
      - '.github/workflows/rust-sdk-ci.yaml'
      - 'flake.nix'
      - 'flake.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  pins-agree:
    name: 'Check the fedimint pins agree'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Compare the crate pin with the flake input pins'
        # The SDK compiles against fedimint and the flake runs devimint from
        # fedimint. If the repository or the revision drifts apart between the
        # two, the client under test and the federation it is tested against
        # stop matching, which surfaces as a runtime mystery rather than a
        # build failure. Cargo.lock and flake.lock are compared too, because
        # CI builds with --locked and a lock left behind would silently
        # build the old code.
        run: |
          set -euo pipefail

          manifest=rust/fedimint-sdk/Cargo.toml
          lock=rust/fedimint-sdk/Cargo.lock
          fail() { echo "::error::$*"; exit 1; }

          # "<owner>/<repo> <rev>" for one flake input, read from that input's own
          # block, so a `?rev=` pin on another input cannot be taken for this one.
          # The scoping relies on the block's multi-line `name = { ... };` shape,
          # asserted below: a block reformatted onto one line makes the sed range
          # below run past this input's own end address into the next block.
          flake_pin() {
            local block
            block=$(sed -n "/^[[:space:]]*$1[[:space:]]*=[[:space:]]*{/,/^[[:space:]]*};/p" \
              flake.nix)
            printf '%s\n' "$block" | head -n1 \
              | grep -qE "^[[:space:]]*$1[[:space:]]*=[[:space:]]*\{[[:space:]]*\$" \
              && printf '%s\n' "$block" | tail -n1 | grep -qE '^[[:space:]]*};[[:space:]]*$' \
              || return 1
            printf '%s\n' "$block" \
              | grep -oE 'github:[A-Za-z0-9._-]+/[A-Za-z0-9._-]+\?rev=[0-9a-f]{40}' \
              | sed -E 's|github:(.*)\?rev=([0-9a-f]{40})|\1 \2|' | sort -u
          }

          # "<owner>/<repo> <rev>" for one flake.lock node's locked reference.
          flake_lock_pin() {
            jq -r --arg name "$1" \
              '.nodes[$name].locked | select(.owner and .repo and .rev)
               | "\(.owner)/\(.repo) \(.rev)"' flake.lock
          }

          manifest_pin=$(grep -oE \
            'git = "https://github\.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+", rev = "[0-9a-f]{40}"' \
            "$manifest" \
            | sed -E 's|git = "https://github\.com/(.*)", rev = "(.*)"|\1 \2|' | sort -u || true)
          lock_pin=$(grep -oE \
            'git\+https://github\.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+\?rev=[0-9a-f]{40}' "$lock" \
            | sed -E 's|git\+https://github\.com/(.*)\?rev=(.*)|\1 \2|' | sort -u || true)
          devimint_pin=$(flake_pin fedimint) \
            || fail "flake.nix input 'fedimint' is not in the expected \`name = { ... };\` shape"
          wasm_pin=$(flake_pin fedimint-wasm) \
            || fail "flake.nix input 'fedimint-wasm' is not in the expected" \
                    "\`name = { ... };\` shape"
          lock_fedimint_pin=$(flake_lock_pin fedimint || true)
          lock_wasm_pin=$(flake_lock_pin fedimint-wasm || true)

          [ -n "$manifest_pin" ] || fail "no github git dependency in $manifest"
          [ "$(printf '%s\n' "$manifest_pin" | wc -l)" -eq 1 ] \
            || fail "$manifest has more than one github git source: $(echo $manifest_pin)"
          [ -n "$devimint_pin" ] \
            || fail "flake.nix input 'fedimint' has no github:<owner>/<repo>?rev=<sha> url"
          [ -n "$wasm_pin" ] \
            || fail "flake.nix input 'fedimint-wasm' has no github:<owner>/<repo>?rev=<sha> url"
          [ "$devimint_pin" = "$wasm_pin" ] \
            || fail "flake.nix inputs disagree: fedimint $devimint_pin, fedimint-wasm $wasm_pin"
          [ -n "$lock_pin" ] || fail "$lock records no github git source; run cargo check"
          [ "$(printf '%s\n' "$lock_pin" | wc -l)" -eq 1 ] \
            || fail "$lock records more than one github git source: $(echo $lock_pin)"
          [ -n "$lock_fedimint_pin" ] \
            || fail "flake.lock node 'fedimint' has no owner/repo/rev in its locked object"
          [ -n "$lock_wasm_pin" ] \
            || fail "flake.lock node 'fedimint-wasm' has no owner/repo/rev in its locked object"
          [ "$lock_fedimint_pin" = "$lock_wasm_pin" ] \
            || fail "flake.lock nodes disagree: fedimint $lock_fedimint_pin," \
                    "fedimint-wasm $lock_wasm_pin"

          manifest_repo=${manifest_pin% *}; manifest_rev=${manifest_pin##* }
          flake_repo=${devimint_pin% *};    flake_rev=${devimint_pin##* }
          lock_repo=${lock_pin% *};         lock_rev=${lock_pin##* }
          flake_lock_repo=${lock_fedimint_pin% *}
          flake_lock_rev=${lock_fedimint_pin##* }

          [ "$manifest_repo" = "$flake_repo" ] \
            || fail "repo mismatch: $manifest uses $manifest_repo, flake.nix uses $flake_repo"
          [ "$manifest_rev" = "$flake_rev" ] \
            || fail "rev mismatch: $manifest is at $manifest_rev, flake.nix is at $flake_rev"
          [ "$lock_repo" = "$manifest_repo" ] \
            || fail "repo mismatch: $lock uses $lock_repo, $manifest uses $manifest_repo"
          [ "$lock_rev" = "$manifest_rev" ] \
            || fail "rev mismatch: $lock is at $lock_rev, $manifest is at $manifest_rev"
          [ "$flake_lock_repo" = "$manifest_repo" ] \
            || fail "repo mismatch: flake.lock 'fedimint' uses $flake_lock_repo," \
                    "$manifest uses $manifest_repo"
          [ "$flake_lock_rev" = "$manifest_rev" ] \
            || fail "rev mismatch: flake.lock 'fedimint' is at $flake_lock_rev," \
                    "$manifest is at $manifest_rev"

          echo "fedimint pins agree: $manifest_repo at $manifest_rev"

  test:
    name: 'Run tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust/fedimint-sdk

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Install native build dependencies'
        # fedimint-connectors builds aws-lc-sys and fedimint-rocksdb builds
        # librocksdb-sys; both run bindgen, which needs libclang.so, and
        # aws-lc-sys wants cmake. A stock ubuntu-24.04 runner has neither
        # libclang.so nor libclang-dev, and without them the build dies with
        # "Unable to find libclang".
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake

      - name: 'Set up Rust'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # The crate is not at the repo root, and `defaults.run` does not
          # reach inside a composite action, so the build cache would key off
          # a non-existent root workspace and silently cache nothing.
          cache-workspaces: rust/fedimint-sdk

      - name: 'Test'
        run: cargo test --locked

  check:
    name: 'Run clippy, fmt, docs and wasm'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust/fedimint-sdk
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Install native build dependencies'
        # fedimint-connectors builds aws-lc-sys and fedimint-rocksdb builds
        # librocksdb-sys; both run bindgen, which needs libclang.so, and
        # aws-lc-sys wants cmake. A stock ubuntu-24.04 runner has neither
        # libclang.so nor libclang-dev, and without them the build dies with
        # "Unable to find libclang".
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          target: wasm32-unknown-unknown
          cache-workspaces: rust/fedimint-sdk

      - name: 'Check fmt'
        run: cargo fmt --all -- --check

      - name: 'Check clippy'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: 'Check docs'
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: 'Check wasm'
        run: cargo check --locked --target wasm32-unknown-unknown
