name: Rust SDK Continuous Integration

# Continuous integration for the fedimint-sdk crate: build, test, clippy
# (default + `--features uniffi`), rustfmt, doc, and the wasm-target check,
# with and without `--features uniffi`.
# The `--features uniffi` clippy is the cheap Android-surface gate: it
# compiles the `#[uniffi::export]` blocks and type derives on the host, no
# cross-compile. The real Android build (2 ABIs) lives in android-native.yaml,
# and the `uniffi-bindgen` run over its output in android-sdk.yaml.
#
# A pull request or a merge group starts this workflow whatever it touches. The
# `changes` job decides whether the crate is checked, and `result` is the one
# check of this workflow for branch protection to require.

on:
  # For rust-sdk-release.yaml, which runs all of this on the release commit.
  workflow_call:

  # On main as well, although the merge queue checks the commit that lands: the
  # build cache that a run on main saves is the one other runs can restore,
  # while the cache of a pull request's run serves only its re-runs.
  push:
    branches: [main]
    paths:
      - 'rust/fedimint-sdk/**'
      # The host-side generator that reads fedimint-sdk's `uniffi` metadata;
      # the check job builds it and lints the crate under `--features uniffi`.
      - 'rust/uniffi-bindgen/**'
      - '.github/workflows/rust-sdk-ci.yaml'
      # The crate requires the fedimint release the flake pins, so a flake
      # bump has to re-run this workflow: pins-agree below checks flake.nix
      # and flake.lock against the crate's requirement, and catches a bump
      # that moved one of the three and not the others.
      - 'flake.nix'
      - 'flake.lock'

  # No `paths:` filter, so that `result` can be a required check: a workflow
  # that a filter never started leaves a required check waiting forever. The
  # `changes` job holds the path list.
  pull_request:

  # The merge queue's run: main plus the pull requests queued ahead, checked
  # before main moves. A required check has to report here as well, or the queue
  # waits for it until it gives up.
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Decides whether this run checks the crate. A pull request or a merge group
  # does when its diff touches the path list below. A push to main always does:
  # the `paths` filter under `push` has already matched it. So does a call from
  # rust-sdk-release.yaml, which checks the commit it publishes. A called
  # workflow sees the event of its caller, a tag push or a manual run.
  changes:
    name: 'Detect changes'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The pull-request comparison needs the merge base as well as both
          # endpoint commits, so keep the complete history.
          fetch-depth: 0

      - name: 'Detect changed paths'
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              diff_args=("$PR_BASE_SHA...$PR_HEAD_SHA")
              ;;
            merge_group)
              diff_args=("$MERGE_GROUP_BASE_SHA" "$MERGE_GROUP_HEAD_SHA")
              ;;
            # A push to main, or a workflow calling this one.
            *)
              echo "rust=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          # Do not let Git collapse a rename into its destination path. Treating
          # it as a deletion plus an addition keeps both sides covered.
          changed_files="$RUNNER_TEMP/changed-files"
          if ! git diff --no-renames --name-only -z "${diff_args[@]}" > "$changed_files"; then
            echo "Could not determine changed paths; checking the crate." >&2
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rust=false
          while IFS= read -r -d '' path; do
            case "$path" in
              # The list under `on.push.paths`, whose comments say why each
              # entry is in it.
              rust/fedimint-sdk/* | rust/uniffi-bindgen/* | \
                .github/workflows/rust-sdk-ci.yaml | flake.nix | flake.lock)
                rust=true
                ;;
            esac
          done < "$changed_files"

          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  pins-agree:
    name: 'Check the fedimint pins agree'
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Compare the crate's fedimint version with the flake's fedimint input"
        # The SDK compiles against fedimint's crates from crates.io and the
        # flake runs devimint from fedimint's repository. If the crates'
        # version and the flake's release tag drift apart, the client under
        # test and the federation it is tested against stop matching, which
        # surfaces as a runtime mystery rather than a build failure.
        # Cargo.lock and flake.lock are compared too, because CI builds with
        # --locked and a lock left behind would silently build the old code.
        run: |
          set -euo pipefail

          manifest=rust/fedimint-sdk/Cargo.toml
          lock=rust/fedimint-sdk/Cargo.lock
          crates_io=registry+https://github.com/rust-lang/crates.io-index
          fail() { echo "::error::$*"; exit 1; }

          # The url values in one flake input's own block, so that another input's url cannot be
          # taken for this one. The sed range ends at the first line starting with `};`, which is
          # this input's own end only for the multi-line `name = { ... };` shape asserted here: a
          # block reformatted onto one line would run on into the next input's block.
          flake_urls() {
            local block
            block=$(sed -n "/^[[:space:]]*$1[[:space:]]*=[[:space:]]*{/,/^[[:space:]]*};/p" \
              flake.nix)
            printf '%s\n' "$block" | head -n1 \
              | grep -qE "^[[:space:]]*$1[[:space:]]*=[[:space:]]*\{[[:space:]]*\$" \
              && printf '%s\n' "$block" | tail -n1 | grep -qE '^[[:space:]]*};[[:space:]]*$' \
              || return 1
            printf '%s\n' "$block" \
              | sed -nE 's/^[[:space:]]*url[[:space:]]*=[[:space:]]*"([^"]*)";[[:space:]]*$/\1/p'
          }

          # Only an exact requirement keeps every later `cargo update` on this release.
          deps=$(grep -E '^[[:space:]]*fedimint-' "$manifest" || true)
          [ -n "$deps" ] || fail "$manifest has no fedimint-* dependency"
          bad=$(printf '%s\n' "$deps" \
            | grep -vE '^fedimint-[A-Za-z0-9_-]+ = "=[0-9][0-9A-Za-z.+-]*"$' | head -n1 || true)
          [ -z "$bad" ] \
            || fail "$manifest has a dependency that is not of the form" \
                    "fedimint-<name> = \"=<version>\": $bad"
          versions=$(printf '%s\n' "$deps" | sed -E 's/^.* = "=(.*)"$/\1/' | sort -u)
          [ "$(printf '%s\n' "$versions" | wc -l)" -eq 1 ] \
            || fail "$manifest requires more than one fedimint version:" \
                    "$(printf '%s\n' "$versions" | paste -sd ' ')"
          version=$versions

          crates=$(printf '%s\n' "$deps" | sed -E 's/^(fedimint-[A-Za-z0-9_-]+) = .*/\1/' | sort -u)
          while IFS= read -r crate; do
            [ "$(grep -cx "name = \"$crate\"" "$lock")" -eq 1 ] \
              || fail "$lock does not have exactly one package named $crate"
            # From the package's `name` line to the blank line that ends its entry.
            package=$(sed -n "/^name = \"$crate\"\$/,/^\$/p" "$lock")
            lock_version=$(printf '%s\n' "$package" | sed -n 's/^version = "\(.*\)"$/\1/p')
            lock_source=$(printf '%s\n' "$package" | sed -n 's/^source = "\(.*\)"$/\1/p')
            [ "$lock_version" = "$version" ] \
              || fail "$lock has $crate at ${lock_version:-no version}, $manifest requires" \
                      "=$version"
            [ "$lock_source" = "$crates_io" ] \
              || fail "$lock has $crate from ${lock_source:-no source}, $manifest requires" \
                      "it from crates.io"
          done <<< "$crates"

          # This also catches a git source that only a transitive dependency has pulled in.
          git_source=$(grep -m1 '^source = "git+https://github.com/fedimint/fedimint' \
            "$lock" || true)
          [ -z "$git_source" ] \
            || fail "$lock has a package from the fedimint git repository, $manifest requires" \
                    "crates.io releases: $git_source"

          urls=$(flake_urls fedimint) \
            || fail "flake.nix input 'fedimint' is not in the expected \`name = { ... };\` shape"
          [ "$(printf '%s\n' "$urls" | grep -c .)" -eq 1 ] \
            || fail "flake.nix input 'fedimint' does not have exactly one url"
          [ "$urls" = "github:fedimint/fedimint/v$version" ] \
            || fail "flake.nix input 'fedimint' has url $urls, $manifest requires" \
                    "github:fedimint/fedimint/v$version"

          # `original` is what flake.nix asked for, `locked` what `nix flake lock` resolved it to
          # and what Nix fetches, so the repository is checked in both.
          node=$(jq -r '
            .nodes.fedimint // empty
            | [.original.owner, .original.repo, .original.ref,
               .locked.owner, .locked.repo, .locked.rev]
            | map(. // "-") | join(" ")' flake.lock) \
            || fail "flake.lock could not be read"
          [ -n "$node" ] || fail "flake.lock has no node 'fedimint'"
          read -r owner repo ref locked_owner locked_repo rev <<< "$node"
          [ "$owner/$repo $ref" = "fedimint/fedimint v$version" ] \
            || fail "flake.lock node 'fedimint' is $owner/$repo at $ref, $manifest requires" \
                    "fedimint/fedimint at v$version"
          [ "$locked_owner/$locked_repo" = "fedimint/fedimint" ] \
            || fail "flake.lock node 'fedimint' is locked to $locked_owner/$locked_repo," \
                    "not to fedimint/fedimint"
          [[ $rev =~ ^[0-9a-f]{40}$ ]] \
            || fail "flake.lock node 'fedimint' has no 40 digit locked rev: $rev"

          echo "fedimint pins agree: $version (fedimint/fedimint at $rev)"

  test:
    name: 'Run tests'
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust/fedimint-sdk

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Install native build dependencies'
        # fedimint-connectors builds aws-lc-sys and fedimint-rocksdb builds
        # librocksdb-sys; both run bindgen, which needs libclang.so, and
        # aws-lc-sys wants cmake. A stock ubuntu-24.04 runner has neither
        # libclang.so nor libclang-dev, and without them the build dies with
        # "Unable to find libclang".
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake

      - name: 'Set up Rust'
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # The crate is not at the repo root, and `defaults.run` does not
          # reach inside a composite action, so the build cache would key off
          # a non-existent root workspace and silently cache nothing.
          cache-workspaces: rust/fedimint-sdk

      - name: 'Test'
        run: cargo test --locked

      - name: 'Test the async-compat runtime invariant'
        # Only meaningful under `--features uniffi`, which the step above does
        # not enable. Losing async-compat's `multi-thread` feature does not
        # fail a build; it aborts the process on the first rocksdb
        # transaction. See `async_compat_runtime` in src/lib.rs.
        run: cargo test --locked --lib --features uniffi async_compat

  check:
    name: 'Run clippy, fmt, docs and wasm'
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust/fedimint-sdk
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Install native build dependencies'
        # fedimint-connectors builds aws-lc-sys and fedimint-rocksdb builds
        # librocksdb-sys; both run bindgen, which needs libclang.so, and
        # aws-lc-sys wants cmake. A stock ubuntu-24.04 runner has neither
        # libclang.so nor libclang-dev, and without them the build dies with
        # "Unable to find libclang".
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy, rustfmt
          target: wasm32-unknown-unknown
          cache-workspaces: |
            rust/fedimint-sdk
            rust/uniffi-bindgen

      - name: 'Check fmt'
        run: cargo fmt --all -- --check

      - name: 'Check clippy'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: 'Check clippy (uniffi feature)'
        run: cargo clippy --locked --lib --features uniffi -- -D warnings

      - name: 'Check docs'
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: 'Check wasm'
        run: cargo check --locked --target wasm32-unknown-unknown

      - name: 'Check wasm (uniffi feature)'
        # The same surface the browser binding is generated from; see js/web/web-sdk. The
        # Android build of it is also what js/react-native/react-native-bindings is generated
        # from.
        run: cargo check --locked --target wasm32-unknown-unknown --features uniffi

  # The one check of this workflow for branch protection to require. It runs on
  # every pull request and merge group whatever they touched, so the check
  # always reports: a job `changes` skipped counts as a pass, one that failed or
  # was cancelled does not. Accepting a skip is safe because no job here has a
  # condition other than the answer of `changes`: when that job fails, the jobs
  # after it are skipped, and its own failure fails this check. `always()`
  # rather than `!cancelled()`, so a cancelled run reports a failure instead of
  # a skip that would read as a pass.
  result:
    name: 'Rust SDK result'
    needs: [changes, pins-agree, test, check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: 'Check every Rust SDK job passed or was skipped'
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=$(jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [[ -n "$failed" ]]; then
            echo "$failed" >&2
            exit 1
          fi
