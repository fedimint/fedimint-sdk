name: Pull Request
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      web: ${{ steps.filter.outputs.web }}
      react-native: ${{ steps.filter.outputs.react-native }}
      docs: ${{ steps.filter.outputs.docs }}
      cli: ${{ steps.filter.outputs.cli }}
      rust-sdk: ${{ steps.filter.outputs.rust-sdk }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull-request comparison needs the merge base as well as both
          # endpoint commits. Keeping the complete history avoids an API call
          # and lets Git calculate that range locally.
          fetch-depth: 0
      - name: Detect changed domains
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          core=false
          web=false
          react_native=false
          docs=false
          cli=false
          rust_sdk=false

          enable_all() {
            core=true
            web=true
            react_native=true
            docs=true
            cli=true
            rust_sdk=true
          }

          emit_outputs() {
            {
              echo "core=$core"
              echo "web=$web"
              echo "react-native=$react_native"
              echo "docs=$docs"
              echo "cli=$cli"
              echo "rust-sdk=$rust_sdk"
            } >> "$GITHUB_OUTPUT"
          }

          # A manually dispatched run is explicitly an all-domain run. Do the
          # same if an event does not provide a reliable revision range: it is
          # better to run unnecessary checks than to skip a required one.
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            enable_all
            emit_outputs
            exit 0
          fi

          changed_files="$RUNNER_TEMP/changed-files"
          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              diff_args=("$base_sha...$head_sha")
              ;;
            push)
              # GitHub uses an all-zero before SHA only when it cannot provide
              # a previous commit, such as the first push of a branch.
              if [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
                enable_all
                emit_outputs
                exit 0
              fi
              diff_args=("$PUSH_BEFORE_SHA" "$PUSH_AFTER_SHA")
              ;;
            *)
              enable_all
              emit_outputs
              exit 0
              ;;
          esac

          # Do not let Git collapse a rename into its destination path. Treating
          # it as a deletion plus an addition keeps both affected domains covered.
          if ! git diff --no-renames --name-only -z "${diff_args[@]}" > "$changed_files"; then
            echo "Could not determine changed paths; running every domain." >&2
            enable_all
            emit_outputs
            exit 0
          fi

          while IFS= read -r -d '' path; do
            case "$path" in
              # Workspace-wide dependency and TypeScript configuration affects
              # every JS domain.
              js/package.json|js/pnpm-lock.yaml|js/pnpm-workspace.yaml|js/.npmrc|js/tsconfig.base.json)
                enable_all
                ;;
              # CI implementation changes must exercise all affected jobs.
              .github/workflows/*|.github/actions/*)
                enable_all
                ;;
              js/shared/core/*|js/shared/types/*|packages/core/*|packages/types/*)
                core=true
                web=true
                docs=true
                ;;
              js/web/react/*|packages/react/*)
                core=true
                ;;
              js/react-native/react-native/*|js/react-native/react-native-bindings/*|scripts/generate-sdk-rn-bindings.sh|scripts/build-sdk-rn-ios.sh|Justfile)
                react_native=true
                ;;
              rust/fedimint-sdk/**|scripts/run-sdk-integration-tests.sh|scripts/devimint-shape.sh)
                rust_sdk=true
                # The web and React Native bindings are generated from the crate; their
                # freshness checks run in the web test job and the Android job.
                web=true
                react_native=true
                ;;
              js/web/core-web/*|js/web/wasm-bundler/*|js/web/wasm-web/*|js/web/integration-tests/*|js/web/sdk-web/*|packages/core-web/*|packages/wasm-bundler/*|packages/wasm-web/*|packages/integration-tests/*|scripts/*)
                web=true
                ;;
              nix/web-bindgen.nix|nix/ubrn-Cargo.lock|nix/ffi.nix)
                web=true
                react_native=true
                ;;
              js/vitest.config.ts|js/vitest.workspace.ts)
                web=true
                cli=true
                ;;
              js/web/transport-web/*|packages/transport-web/*)
                web=true
                docs=true
                ;;
              flake.nix|flake.lock)
                web=true
                react_native=true
                rust_sdk=true
                ;;
              js/docs/*|docs/*)
                docs=true
                ;;
              js/tools/create-fedimint-app/*|packages/create-fedimint-app/*)
                cli=true
                ;;
            esac
          done < "$changed_files"

          emit_outputs

  verify:
    name: Verify
    needs: detect-changes
    uses: ./.github/workflows/verify.yml
    secrets: inherit
    with:
      run_core: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.core == 'true' || needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.cli == 'true' }}
      run_web: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.web == 'true' }}
      run_docs: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.docs == 'true' }}
      run_cli: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.cli == 'true' }}

  test-react-native:
    name: Test React Native
    needs: detect-changes
    if: ${{ github.event.action != 'labeled' && (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.react-native == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps
      - name: Run the unit tests
        run: pnpm --dir js test:reactnative --run
      - name: Type-check the package against the stubbed bindings
        # The package is excluded from the root typecheck because its real bindings types are
        # ubrn-generated and need a package build; this config maps them to the test stub so the
        # type-level contract still gets checked.
        run: pnpm --dir js --filter @fedimint/react-native typecheck:test

  build-android:
    name: Build Android
    needs: detect-changes
    if: ${{ github.event.action != 'labeled' && (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.react-native == 'true') }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: ./.github/actions/build-rn-android

  integration-test-sdk:
    name: 'Integration test SDK (${{ matrix.shape }})'
    needs: detect-changes
    if: ${{ github.event.action != 'labeled' && (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.rust-sdk == 'true') }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    # Non-blocking on day one: let the suite build a track record before
    # promoting it to a required check.
    continue-on-error: true
    concurrency:
      # Global lock: serializes all devimint runs on the
      # self-hosted runner regardless of which PR or matrix leg triggered them,
      # so two concurrent jobs cannot collide on ports or state.
      group: devimint-integration
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        shape: [v1, v2]

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Setup Nix'
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: 'Run integration tests (${{ matrix.shape }})'
        id: run-tests
        timeout-minutes: 35
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/devimint-logs"
          export FM_TEST_DIR="$GITHUB_WORKSPACE/devimint-logs"
          export TMPDIR="$GITHUB_WORKSPACE/devimint-logs"
          nix develop --accept-flake-config .#wasm-tests --command \
            scripts/run-sdk-integration-tests.sh ${{ matrix.shape }}

      - name: 'Upload devimint logs'
        if: ${{ !cancelled() && steps.run-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: devimint-logs-${{ matrix.shape }}-${{ github.run_id }}
          path: |
            devimint-logs/**/*.log
            devimint-logs/**/FM_*
          retention-days: 7
          if-no-files-found: ignore
