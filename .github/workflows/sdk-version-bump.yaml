name: SDK Version Bump

# Bumps the version of the SDK's components, writes their release notes and
# opens a pull request with both. The components are the Rust crate, the
# Android SDK, the React Native packages and the web SDK, and they share one
# line of versions: a release takes the next version of the line and gives it
# to the components it publishes. Picking `all`, `bindings` or one binding when
# running this decides which components get it; the others keep their version,
# and their files are not touched.
#
# Run it on main, and its pull request targets main: sdk-tag.yaml only tags
# main, so it refuses to run anywhere else.
#
# Pick what to release:
#
#   all         the Rust crate and every binding.
#   bindings    every binding: the Android SDK, the React Native packages and
#               the web SDK.
#   android, react-native, web
#               that binding alone.
#
# and how to bump:
#
#   patch, minor, major   from a release, start the next version. With
#                         `beta` ticked it starts at `-beta.1`.
#   beta                  from a beta, the next beta.
#   release               from a beta, release it: X.Y.Z-beta.N -> X.Y.Z.
#
# RELEASING.md, "Versions", says which bump a change calls for.
#
# scripts/sdk-release.sh bump works the new version out and refuses a bump
# that does not fit, such as `patch` in the middle of a beta. It also checks
# the new version against every release tag and every version on npm and
# crates.io, so this cannot propose a version that is taken. Nothing is
# written unless every check passed.
#
# The notes of each component that gets the version are written from the
# commits since its last release that touched it (scripts/sdk-changelog.sh):
# the breaking ones, `feat` and `fix`, as a section of its CHANGELOG.md, and
# a line when the fedimint the crate is built against has changed. The pull
# request lists the commits that got no entry (`sdk-changelog.sh left-out`),
# so that whoever reads the notes can add a line for what users see among
# them. Editing the notes in the pull request is optional.
#
# Merging the pull request starts the release: sdk-tag.yaml then tags the
# merge commit for each component that got the version and starts that
# component's release workflow on it, the first release of a component
# included. Whether a release is published is decided after that, by the
# required reviewers of the environment its component publishes in
# (`crates-io`, `maven-central` or `npm`). RELEASING.md, at the repository
# root, describes the whole process.
#
# The pull request is opened with a token of a GitHub App, not with the
# workflow's own token: GitHub starts no workflow from an event made with a
# workflow's own token, so a pull request opened with it would get none of its
# checks. The job reads the app's Client ID and private key from the
# `version-bump` environment, which only main may use. RELEASING.md, "What
# the releases rely on", says how the app and the environment are set up.

on:
  workflow_dispatch:
    inputs:
      components:
        description: >-
          What to release. all: the Rust crate and every binding. bindings: every binding,
          the Android SDK, the React Native packages and the web SDK. Or one binding.
        type: choice
        options:
          - all
          - bindings
          - android
          - react-native
          - web
      bump:
        description: >-
          patch/minor/major: next version after a release. beta: next beta. release: finish
          the beta.
        type: choice
        options:
          - patch
          - minor
          - major
          - beta
          - release
      beta:
        description: 'For patch, minor or major: start the new version at -beta.1'
        type: boolean
        default: true

# One bump at a time: two in flight would both start from the same version.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Only to push the bump branch: the app's token opens the pull request.
permissions:
  contents: write

defaults:
  run:
    # Named so that `pipefail` is on, which the default shell leaves off.
    shell: bash

jobs:
  bump:
    name: 'Open the version bump pull request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Holds the credentials of the GitHub App that opens the pull request.
    environment: version-bump

    steps:
      # Main only. The pull request goes into main, and sdk-tag.yaml only tags
      # pushes to main, so a bump merged anywhere else would never start a
      # release even though its pull request says that merging does. The
      # environment refuses a run on any other branch before this step, if it
      # is limited to main as it should be. This step still refuses it, and
      # says why, if it is not.
      - name: 'Require main'
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::run the SDK Version Bump on main, not $REF: releases are only tagged" \
            "from main"
          exit 1

      # A token that can open the pull request, and nothing else. It is made
      # before anything is pushed, so that an app that is not set up stops
      # the run while there is nothing to clean up. The action is pinned to a
      # commit, as it is handed the app's private key.
      - name: 'Get a token of the GitHub App'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      # Credentials kept, unlike the other workflows: this job pushes the
      # bump branch. The full history and tags are for the checks, which read
      # the release tags, and for writing the notes, which are made from the
      # commits since the last release's tag.
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # npm and curl, which the checks ask for the versions on the registries,
      # are on the runner. The new version is the only line on stdout.
      - name: 'Bump the versions and write the notes'
        id: bump
        env:
          GROUP: ${{ inputs.components }}
          BUMP: ${{ inputs.bump }}
          START_AS_BETA: ${{ inputs.beta }}
        run: |
          args=("$GROUP" "$BUMP")
          case "$BUMP" in
            patch | minor | major)
              if [[ "$START_AS_BETA" == true ]]; then
                args+=(--beta)
              fi
              ;;
          esac
          next="$(scripts/sdk-release.sh bump "${args[@]}")"
          echo "next=$next" >>"$GITHUB_OUTPUT"

      # The files are changed and not committed yet, so a component's version
      # at HEAD is the one it was bumped from. The branch is pushed with the
      # workflow's own token, which the checkout kept, and the pull request is
      # opened with the app's, which is what starts its checks.
      - name: 'Open the pull request'
        env:
          GROUP: ${{ inputs.components }}
          NEXT: ${{ steps.bump.outputs.next }}
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          . scripts/sdk-components.sh
          branch="sdk/version-$NEXT"
          # An earlier bump to this version that is still open, or was
          # abandoned, has left its branch, and a push to it is rejected.
          status=0
          git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null || status=$?
          case "$status" in
            0)
              echo "::error::the branch $branch exists already, most likely from a bump to" \
                "$NEXT that is still open or was abandoned. Delete the branch, and close its" \
                "pull request, before running this workflow again."
              exit 1
              ;;
            2) ;;
            *)
              echo "::error::could not ask origin whether the branch $branch exists."
              exit 1
              ;;
          esac
          case "$GROUP" in
            all) what='the SDK' ;;
            bindings) what='the bindings' ;;
            *) what="the $(component_title "$GROUP")" ;;
          esac
          names="$(scripts/sdk-version.sh components "$GROUP")"
          bumped=""
          notes=""
          tags=""
          left_out=""
          while IFS= read -r component; do
            from="$(scripts/sdk-version.sh current "$component" --at HEAD)"
            bumped+="- $(component_title "$component"): \`$from\` to \`$NEXT\`"$'\n'
            notes+="- \`$(component_changelog "$component")\`"$'\n'
            tags="${tags:+$tags, }\`$(component_tag_prefix "$component")$NEXT\`"
            # A component that has no release yet gets the notes of a first
            # release, which leave no commits out.
            latest="$(scripts/sdk-release.sh latest "$component")"
            if [[ -n "$latest" ]]; then
              # The commits that got no entry in its notes, for whoever reads
              # them. GitHub limits a pull request body to 65536 characters, so
              # no more than 50 of each component are listed.
              commits="$(scripts/sdk-changelog.sh left-out "$component" "$latest")"
              if [[ -n "$commits" ]]; then
                count="$(grep -c '' <<<"$commits")"
                summary="Not in the $(component_title "$component")'s notes: $count commits"
                [[ "$count" -ne 1 ]] || summary="${summary%s}"
                left_out+="<details><summary>$summary</summary>"$'\n\n'
                left_out+="$(sed -n '1,50p' <<<"$commits")"$'\n\n'
                if [[ "$count" -gt 50 ]]; then
                  more="\`scripts/sdk-changelog.sh left-out $component $latest\`"
                  left_out+="And $((count - 50)) more: $more lists them all."$'\n\n'
                fi
                left_out+="</details>"$'\n\n'
              fi
            fi
          done <<<"$names"
          body="$(
            echo "Bumps $what to \`$NEXT\` (\`$BUMP\`):"
            echo
            printf '%s' "$bumped"
            echo
            echo "The \`## $NEXT\` notes in these files are written from the breaking," \
              "\`feat\` and \`fix\` commits since each component's last release:"
            echo
            printf '%s' "$notes"
            echo
            # One paragraph, on one line: GitHub shows every line break of the body.
            review="Editing them in this pull request is optional. Check their Added and Fixed"
            review+=" lines for a change that breaks callers: it belongs under Breaking when its"
            review+=" commit had no \`!\`."
            if [[ -n "$left_out" ]]; then
              review+=" The commits below got no line. Add one for anything among them that"
              review+=" users see."
            fi
            echo "$review"
            echo
            printf '%s' "$left_out"
            echo "**Merging this starts the release of \`$NEXT\`** of those components. The SDK" \
              "Tag workflow tags the merge commit ($tags) and starts each component's release" \
              "workflow on its tag. Each release then waits for a reviewer of its environment" \
              "to approve the job that publishes."
            echo
            echo "The pull request's checks also build the native libraries that the release" \
              "then takes from the cache, so let them finish before merging."
          )"
          subject="chore(release): bump $what to $NEXT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "$subject"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "$subject" \
            --body "$body"
