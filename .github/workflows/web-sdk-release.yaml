name: Web SDK Release

# This workflow builds, tests and publishes the browser package,
# @fedimint/web-sdk, to npm. Nothing is published by hand once the package has
# its first version (see below). RELEASING.md, at the repository root,
# describes the whole process of a release.
#
# To release, run sdk-version-bump.yaml (Actions → SDK Version Bump) for
# `web`, or for `bindings` or `all` to release other components with it. It
# opens a pull request that sets the version of the package and writes the
# version's section in js/web/web-sdk/CHANGELOG.md from the commits since the
# last release. Edit the notes in that pull request if they need more, which is
# optional, and merge it: sdk-tag.yaml then tags the merge commit
# `web-sdk-v<version>` and starts this workflow on the tag. Pushing such a tag
# by hand starts a release too, and the checks are the same either way.
#
# The version is in the tree: js/web/web-sdk/package.json has it, and the
# package is `"private": true`. That keeps every other publishing path in the
# repository (a stray `pnpm publish -r`) away from it. The tarball `pack` makes
# is the exception: it carries the version that `check` read from the tree, and
# no `private`. It goes out as `X.Y.Z-beta.N` under the `beta` dist-tag and as
# `X.Y.Z` under `latest`. Until its first version bump the package is at
# `0.0.0` in the tree, which the release scripts read as "not released yet", so
# a dry run on main then warns that the version cannot be released and packs
# fedimint-web-sdk-0.0.0.tgz: it tries the build, the pack and the test, and is
# no rehearsal of a release.
#
# The jobs, in order:
#
#   check           the tag: a web SDK one, whose version is the one the
#                   package has in the tree, whose commit is on main and whose
#                   version has notes, and which is newer than every earlier
#                   release tag of any component and every version of the
#                   package on npm (scripts/sdk-release.sh)
#   module          builds the SDK's WebAssembly module on a self-hosted runner
#   pack            regenerates the bindings from that module and fails if they
#                   differ from the committed ones, builds the package, then
#                   packs it and refuses a tarball that is not fit to publish
#   test            installs the tarball into a fresh app, the way an app adds
#                   it, builds the app with Vite and opens the SDK in a headless
#                   browser
#   publish         to npm; a version already there as the same tarball is
#                   skipped, so the failed jobs of a half-finished release can
#                   be run again
#   github-release  the GitHub Release: the version's notes from
#                   js/web/web-sdk/CHANGELOG.md, the tarball, its sum
#
# What is published is what was tested: `publish` uploads the very tarball
# `pack` made and `test` installed, and stops when npm already has the version
# as any other tarball.
#
# A manual run (workflow_dispatch) with `publish` unticked, the default, is a
# dry run. It does what a release does up to and including `test`, and then
# `npm publish --dry-run`. It publishes nothing, tags nothing and creates no
# release. It may run on a branch, such as the one of a version bump pull
# request: the version in the tree is then checked as a release would, and a
# version that could not be released only warns. On a tag, whether or not
# `publish` is ticked, the tag is held to the release rules.
#
# A manual run with `publish` ticked publishes like a tag push, and only on a
# `web-sdk-v*` tag: on any other ref it is refused. That is how sdk-tag.yaml
# starts a release.
#
# Nothing here holds a credential for npm. `publish` uses npm trusted
# publishing: the trusted publisher set up on npm accepts an upload from this
# workflow file in this repository, running in the `npm` environment, and from
# no other workflow. So what decides whether something is published is that
# environment:
#
#   * its required reviewers approve every run of `publish` before it starts.
#     They are the gate, and they have to be configured (Settings →
#     Environments → npm): naming the environment here does not add any.
#     Whoever approves checks that the run is the release that was merged:
#     its tag, and that the tagged commit is on main;
#   * it accepts `web-sdk-v*` tags as well as `react-native-sdk-v*` ones, and
#     has to exist before the first release: a job that names a missing
#     environment creates it, without any rule.
#
# npm lets only a package that exists set up a trusted publisher, so
# @fedimint/web-sdk needs a first version on npm, published by hand, before
# this workflow can publish. RELEASING.md, "The first release of the web SDK",
# describes it.
#
# A tag ruleset could not be that gate, and `check` is not. A ruleset for
# `web-sdk-v*` forbids updating and deleting a release tag, so a tag never
# moves, but none restricts creating one: sdk-tag.yaml creates the tags with
# the workflow's own token, which GitHub does not accept on a ruleset's bypass
# list in an organization's repository. So everybody who can push can create
# such a tag, on any commit, and a workflow runs as its file is in the tagged
# commit. `check` therefore stops mistakes, not misuse: a version that is not
# the one in the tree, a commit that is not on main, a version that is taken,
# notes that are missing.
#
# `id-token: write` exists on `publish` alone, `contents: write` on
# `github-release` alone.
#
# Trusted publishing does not work on self-hosted runners, so `publish` runs
# on a hosted one.
#
# A tag and an npm version are both permanent. A release that turns out bad
# is fixed by the next one.

on:
  push:
    tags:
      - 'web-sdk-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (unticked: dry run, nothing is published)'
        type: boolean
        default: false

# A release is a tag push or a manual run with `publish`, and releases run
# one at a time. `queue: max` lets up to 100 of them wait; without it a third
# release would cancel the second. They start in the order they began to
# wait, which GitHub does not promise to be the order the tags were pushed
# in. Whatever the order, no dist-tag moves back to an older release: `check`
# refuses a release that starts when a newer tag exists, and
# scripts/sdk-npm-publish.sh refuses to publish under a dist-tag
# that is already on a newer version.
# Dry runs publish nothing, so each gets a group of its own and neither waits
# for a release nor holds one up.
concurrency:
  group: >-
    ${{ (github.event_name == 'push' || inputs.publish) && 'web-sdk-release'
    || format('web-sdk-dry-run-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

# The least any job needs. The two jobs that need more say so themselves.
permissions:
  contents: read

defaults:
  run:
    # Named so that `pipefail` is on, which the default shell leaves off.
    shell: bash

jobs:
  check:
    name: 'Check the version'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}

    steps:
      # The whole history and every tag: the checks compare with the release
      # tags of every component and need origin/main to tell whether the
      # tagged commit is on it.
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # scripts/sdk-release.sh holds the rules a release must pass, the same
      # ones sdk-tag.yaml applies before it tags; its header lists them. It
      # asks npm for the versions of the package, and npm is on the runner.
      # The version is the one the package has in the tree, which on a tag is
      # the tag's. It is read first: a version that cannot be read fails the
      # step at once, with the message of scripts/sdk-version.sh and nothing
      # else, before any check or warning.
      #
      # On a tag, pushed or started by hand, `check-tag` holds the tag to the
      # rules, so that a release does not go out by mistake under a version
      # nobody tagged, nor from a commit that is not on main. It accepts the
      # release tag of any component, so the tag has to be a web SDK one
      # first, or a run on the tag of another component would build the
      # package under it.
      #
      # A manual run on a branch is a dry run: `check` applies the rules to
      # the version in the tree. The dry run publishes nothing, so a version
      # that could not be released only warns. The pull request check,
      # `scripts/sdk-release.sh check-tree`, is what stops a bad version
      # before it is merged, and a dry run on the branch of a version bump
      # shows whether its release would go through.
      - name: 'Check the version'
        id: check
        run: |
          version="$(scripts/sdk-version.sh current web)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != web-sdk-v* ]]; then
              echo "::error::$GITHUB_REF_NAME is not a tag of the Web SDK" \
                "(web-sdk-v*); run this workflow from one of its tags"
              exit 1
            fi
            scripts/sdk-release.sh check-tag "$GITHUB_REF_NAME"
          elif ! scripts/sdk-release.sh check web; then
            echo "::warning::the version in the tree could not be released as it is; see the" \
              "checks above. This dry run goes on because it publishes nothing. The pull" \
              "request check, scripts/sdk-release.sh check-tree, is what stops a bad version" \
              "before it is merged."
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # A release has to come from a tag, so that the check above has a tag to
      # hold the version to. A tag push always does. A manual run may not.
      - name: 'Refuse to publish from a branch'
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_type != 'tag'
        run: |
          echo "::error::publishing to npm needs a web-sdk-v* tag; run this workflow" \
            "from the tag, not from $GITHUB_REF_NAME"
          exit 1

  # The SDK's WebAssembly module, built from rust/fedimint-sdk's sources. A
  # version bump that includes the crate changes them, and its releases start
  # seconds after the merge, so the module is not in the Cachix cache yet. A
  # cold build of the crate for wasm is too big for a hosted runner: the
  # self-hosted runners, which share a Nix store, build it, as they build the
  # Android libraries (see android-native.yaml). cachix-action's post step
  # pushes what this job built.
  module:
    name: 'Build the WebAssembly module'
    needs: check
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Setup Nix'
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The module is a store path behind a symlink; the artifact is a copy.
      - name: 'Build the module'
        run: |
          nix build -L --accept-flake-config .#fedimint-sdk-wasm -o sdk-wasm
          mkdir -p "$RUNNER_TEMP/module"
          cp --no-preserve=mode sdk-wasm/lib/fedimint_sdk.wasm "$RUNNER_TEMP/module/"

      - name: 'Upload the module'
        uses: actions/upload-artifact@v7
        with:
          name: web-sdk-module
          path: ${{ runner.temp }}/module/fedimint_sdk.wasm
          if-no-files-found: error

  pack:
    name: 'Pack the package'
    needs: [check, module]
    # Hosted: the tarball that gets published is made on a machine nothing
    # else has run on.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Setup Nix'
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: 'Install JS dependencies'
        run: |
          nix develop --accept-flake-config .#wasm --command \
            pnpm --dir js install --frozen-lockfile

      - name: 'Download the module'
        uses: actions/download-artifact@v8
        with:
          name: web-sdk-module
          path: ${{ runner.temp }}/module

      # The bindings and the wasm-bindgen glue are generated from the module
      # that gets packed, and the module is staged beside them. The committed
      # bindings must match it: if they described another version of the
      # library than the one beside them, UniFFI's checksum check would fail
      # in every app at startup.
      - name: 'Generate the bindings and stage the module'
        uses: ./.github/actions/build-sdk-web
        with:
          wasm: ${{ runner.temp }}/module/fedimint_sdk.wasm

      - name: 'Build the package'
        run: |
          nix develop --accept-flake-config .#wasm --command \
            pnpm --dir js/web/web-sdk run build

      # Writes the version, drops `private`, packs, and then checks the
      # tarball itself: see scripts/web-sdk-pack.sh for what a tarball must
      # and must not contain.
      - name: 'Pack and check the tarball'
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          nix develop --accept-flake-config .#wasm --command \
            scripts/web-sdk-pack.sh "$VERSION" "$RUNNER_TEMP/tarball"
          {
            echo '### Tarball'
            echo
            echo '```'
            ls -l "$RUNNER_TEMP/tarball"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: 'Upload the tarball'
        uses: actions/upload-artifact@v7
        with:
          name: web-sdk-tarball
          path: ${{ runner.temp }}/tarball/*.tgz
          if-no-files-found: error
          # It is compressed already.
          compression-level: 0

  # The tarball, not the workspace: scripts/web-sdk-smoke.sh installs it into
  # a fresh app as a plain dependency, builds the app with Vite and opens the
  # SDK in headless Chromium, so that a file that is missing from the package,
  # or a module that does not load, stops the release here.
  test:
    name: 'Build an app from the tarball and run it'
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Setup Nix'
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The smoke test runs Vite and Playwright from the workspace.
      - name: 'Install JS dependencies'
        run: |
          nix develop --accept-flake-config .#wasm --command \
            pnpm --dir js install --frozen-lockfile

      - name: 'Download the tarball'
        uses: actions/download-artifact@v8
        with:
          name: web-sdk-tarball
          path: ${{ runner.temp }}/tarball

      - name: 'Build an app from the tarball and run it'
        run: |
          nix develop --accept-flake-config .#wasm --command \
            scripts/web-sdk-smoke.sh "$RUNNER_TEMP"/tarball/fedimint-web-sdk-*.tgz

  # The end of a dry run: a manual run without `publish`. It has no access to
  # npm: no environment, no token and no `id-token` permission.
  dry-run:
    name: 'Dry run: npm publish --dry-run'
    needs: [pack, test]
    if: github.event_name == 'workflow_dispatch' && !inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Set up Node'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 'Download the tarball'
        uses: actions/download-artifact@v8
        with:
          name: web-sdk-tarball
          path: ${{ runner.temp }}/tarball

      - name: 'npm publish --dry-run'
        run: scripts/sdk-npm-publish.sh --dry-run web "$RUNNER_TEMP/tarball"

  publish:
    name: 'Publish to npm'
    needs: [pack, test]
    # A tag push and a manual run with `publish` on a tag both publish: the
    # second is how sdk-tag.yaml starts a release. The `npm` environment
    # refuses every ref that is not a `web-sdk-v*` or `react-native-sdk-v*`
    # tag as well.
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
    # Trusted publishing needs a hosted runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      # What npm exchanges for a short-lived publish token.
      id-token: write

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # For its npm: trusted publishing needs 11.5.1 or later, and the
      # runner's own is older. No registry is configured here on purpose:
      # that would write a placeholder token, and npm would fall back to it,
      # with a misleading error, should the token exchange ever fail.
      - name: 'Set up Node'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 'Download the tarball'
        uses: actions/download-artifact@v8
        with:
          name: web-sdk-tarball
          path: ${{ runner.temp }}/tarball

      # A package whose version is already on npm as the same tarball is
      # skipped: see scripts/sdk-npm-publish.sh.
      - name: 'Publish'
        run: scripts/sdk-npm-publish.sh web "$RUNNER_TEMP/tarball"

      # What npm serves, with its SHA-256 sum, for the GitHub Release.
      - name: 'Upload the published tarball'
        uses: actions/upload-artifact@v7
        with:
          name: web-sdk-published
          path: |
            ${{ runner.temp }}/tarball/*.tgz
            ${{ runner.temp }}/tarball/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  # The tag's page: the version's section of js/web/web-sdk/CHANGELOG.md as
  # the notes, and what was published. A beta is marked as a pre-release.
  # Running a release again updates the release instead of failing on it.
  github-release:
    name: 'Create the GitHub Release'
    needs: [check, publish]
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Download the published tarball'
        uses: actions/download-artifact@v8
        with:
          name: web-sdk-published
          path: ${{ runner.temp }}/published

      - name: 'Create or update the release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
            # Each paragraph and list item on one line: a GitHub Release
            # shows every line break of its text, so the file's wrapping
            # would show.
            scripts/sdk-changelog.sh release-notes web "$VERSION"
            # The backticks are a Markdown code fence, not an expansion.
            # shellcheck disable=SC2016
            printf '\n```sh\nnpm install %s\n```\n' "@fedimint/web-sdk@$VERSION"
          } >"$notes"
          prerelease=()
          if [[ "$VERSION" == *-beta.* ]]; then
            prerelease=(--prerelease)
          fi
          assets=("$RUNNER_TEMP"/published/*.tgz "$RUNNER_TEMP/published/SHA256SUMS")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Web SDK $VERSION" --notes-file "$notes" \
              "${prerelease[@]}"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" --verify-tag "${prerelease[@]}" \
              --title "Web SDK $VERSION" --notes-file "$notes" "${assets[@]}"
          fi
