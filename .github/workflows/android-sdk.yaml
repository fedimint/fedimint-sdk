name: Android SDK

# Generates the Kotlin bindings from the shared Android native library, then
# proves the whole chain builds: the AAR, and the example app compiled against
# the freshly generated bindings.
#
# Every task runs exactly once, and each job downloads what the one before it
# produced instead of redoing it:
#
#   native    cross-compiles the .so                    -> jniLibs
#   bindings  runs `uniffi-bindgen` against that .so    -> android-bindings
#   apk       Gradle: the example app's debug APK       -> android-example-apk
#   e2e       installs that APK on an emulator and drives it
#   kotlin    Gradle: the release AAR                   -> fedimint-android-aar
#
# The native `.so` is not built here. `android-native.yaml` builds it once and
# this workflow calls that, then runs `uniffi-bindgen` against the artifact it
# produced. Generating from the built binary rather than from the crate source
# is what makes the Kotlin and the library it loads impossible to get out of
# step — and it leaves the expensive cross-compile as one job that any other
# binding generator can call the same way.
#
# Nothing is published here. android-sdk-release.yaml and
# android-sdk-snapshot.yaml call this whole chain and publish the AAR only after
# every job in it has passed.
#
# `e2e` is the one job that needs the single self-hosted Mac, so it does not
# run on every pull request. A pull request gets it only when it carries the
# `ci-android-e2e` label; the merge queue runs the whole chain unless every
# changed file matches a known Android-unrelated exclude list, so nothing
# reaching main can skip a check it might depend on. The `changes` job decides,
# and `result` is the one check branch protection requires from here.

on:
  workflow_dispatch:
  # For android-sdk-release.yaml and android-sdk-snapshot.yaml. After this
  # chain has passed, they reuse its jniLibs and bindings artifacts rather
  # than building their own, and assemble the published AAR from them.
  workflow_call:
    outputs:
      jni-artifact:
        description: 'Name of the uploaded jniLibs artifact'
        value: ${{ jobs.native.outputs.jni-artifact }}
      bindings-artifact:
        description: 'Name of the uploaded Kotlin bindings artifact'
        value: ${{ jobs.bindings.outputs.bindings-artifact }}
  # The single PR entry point for the Android chain. android-native.yaml has no
  # PR trigger of its own precisely so that this workflow is the whole story:
  # one run, one cross-compile, whatever the PR touched.
  #
  # No `paths:` filter. Branch protection requires `result`, and a workflow a
  # filter never started leaves a required check waiting forever, so this one
  # starts on every pull request and the `changes` job holds the path list.
  pull_request:
  # The merge queue's run: main plus the PRs queued ahead, tested before main
  # moves. Runs the whole chain, e2e included, unless every changed path matches
  # `changes`'s fail-closed exclude list.
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# `contents: read` rather than `{}`: this workflow calls another one, and a
# called workflow can never hold more permissions than its caller grants. With
# no permissions at all the call is refused before the callee's jobs are ever
# created — which shows up as this workflow's own job being skipped, with no
# log to read anywhere.
permissions:
  contents: read

jobs:
  # Decides what this run builds. A pull request uses an allow-list so unrelated
  # PRs skip the build, and runs e2e only with the `ci-android-e2e` label.
  #
  # A merge group is the last check before main, and e2e also depends on files
  # outside Android proper (`setup-nix`, `devimint-shape.sh`, the full `js`
  # workspace whose `pnpm install` runs workspace `prepare` scripts such as
  # `js/web/web-sdk` and `react-native-bindings`, and `rust/ubrn` pulled into
  # `.#android` and `.#android-tests`). An allow-list there fails open on any
  # omitted dependency, so `merge_group` uses a fail-closed exclude list
  # instead: the whole chain (e2e included) runs unless every changed path is
  # one the chain cannot depend on. Every other event (manual dispatch, release,
  # snapshot) runs the whole chain.
  changes:
    name: 'Detect changes'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
      e2e: ${{ steps.filter.outputs.e2e }}

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The pull-request comparison needs the merge base as well as both
          # endpoint commits, so keep the complete history.
          fetch-depth: 0

      - name: 'Detect changed paths'
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          E2E_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-android-e2e') }}
        run: |
          set -euo pipefail

          android=false
          e2e=false

          run_everything() {
            android=true
            e2e=true
          }

          emit_outputs() {
            {
              echo "android=$android"
              echo "e2e=$e2e"
            } >> "$GITHUB_OUTPUT"
          }

          case "$EVENT_NAME" in
            pull_request)
              # Asking for e2e asks for the chain it needs, whatever the PR
              # touched.
              if [[ "$E2E_LABEL" == true ]]; then
                run_everything
                emit_outputs
                exit 0
              fi
              diff_args=("$PR_BASE_SHA...$PR_HEAD_SHA")
              ;;
            merge_group)
              if [[ -z "$MERGE_GROUP_BASE_SHA" || -z "$MERGE_GROUP_HEAD_SHA" ]]; then
                echo "Missing merge_group commit SHAs; building the whole chain." >&2
                run_everything
                emit_outputs
                exit 0
              fi
              diff_args=("$MERGE_GROUP_BASE_SHA" "$MERGE_GROUP_HEAD_SHA")
              ;;
            # A manual run, or a release or snapshot call.
            *)
              run_everything
              emit_outputs
              exit 0
              ;;
          esac

          # Do not let Git collapse a rename into its destination path. Treating
          # it as a deletion plus an addition keeps both sides covered.
          changed_files="$RUNNER_TEMP/changed-files"
          if ! git diff --no-renames --name-only -z "${diff_args[@]}" > "$changed_files"; then
            echo "Could not determine changed paths; building the whole chain." >&2
            if [[ "$EVENT_NAME" == merge_group ]]; then
              run_everything
            else
              android=true
            fi
            emit_outputs
            exit 0
          fi

          if [[ "$EVENT_NAME" == merge_group ]]; then
            # Fail closed: run the whole chain unless every changed path
            # matches a location the Android chain cannot depend on. `js/*`
            # (non-Markdown) and `rust/ubrn/*` are intentionally omitted so
            # changes that can break `pnpm --dir js install` workspace
            # `prepare` scripts or `.#android` / `.#android-tests` shells never
            # skip the queue.
            while IFS= read -r -d '' path; do
              case "$path" in
                # Markdown, docs site, skills, native Swift SDK, formatting/license.
                *.md|docs/*|skills/*|ios/*|LICENSE|.prettierignore|.prettierrc.json)
                  ;;
                # Repo metadata and non-Android GitHub Actions / workflows.
                .github/CODEOWNERS|.github/dependabot.yml|.github/icon.png)
                  ;;
                .github/actions/build-rn-android/*|.github/actions/build-rn-ios/*|.github/actions/build-sdk-web/*|.github/actions/install-deps/*)
                  ;;
                .github/workflows/docs.yaml|.github/workflows/ios-native.yaml|.github/workflows/pull-request.yml|.github/workflows/react-native-sdk-release.yaml|.github/workflows/rust-sdk-ci.yaml|.github/workflows/rust-sdk-release.yaml|.github/workflows/sdk-release-scripts.yaml|.github/workflows/sdk-tag.yaml|.github/workflows/sdk-version-bump.yaml|.github/workflows/swift-sdk.yaml|.github/workflows/verify.yml|.github/workflows/web-sdk-release.yaml)
                  ;;
                # Explicit iOS, Web, React Native, Rust-only, and release scripts.
                scripts/assemble-ios-xcframework.sh|scripts/assemble-rn-ios-xcframework.sh|scripts/build-ios-lib.sh|scripts/build-ios-sdk.sh|scripts/build-sdk-rn-ios.sh|scripts/generate-swift-bindings.sh|scripts/hide-ios-symbols.sh|scripts/nix-build-ios-lib.sh)
                  ;;
                scripts/generate-sdk-rn-bindings.sh|scripts/generate-sdk-web-bindings.sh|scripts/nix-build-sdk-wasm.sh|scripts/react-native-sdk-example.sh|scripts/react-native-sdk-pack.sh|scripts/react-native-sdk-smoke.js|scripts/react-native-sdk-smoke.sh|scripts/rn-android-emulator.sh|scripts/rn-android-example.sh|scripts/sdk-web-wasm-size.sh|scripts/web-sdk-pack.sh|scripts/web-sdk-smoke.sh|scripts/web-sdk-smoke/*)
                  ;;
                scripts/run-sdk-examples.sh|scripts/run-sdk-examples-inner.sh|scripts/run-sdk-integration-tests.sh|scripts/rust-sdk-publish.sh|scripts/sdk-changelog.sh|scripts/sdk-components.sh|scripts/sdk-npm-publish.sh|scripts/sdk-release.sh|scripts/sdk-version.sh|scripts/test-assemble-rn-ios-xcframework.sh|scripts/test-build-sdk-rn-ios.sh|scripts/test-hide-ios-symbols.sh|scripts/test-react-native-sdk-scripts.sh|scripts/test-sdk-release-scripts.sh|scripts/test-sdk-web-wasm-size.sh|scripts/test-web-sdk-scripts.sh)
                  ;;
                *)
                  run_everything
                  break
                  ;;
              esac
            done < "$changed_files"
          else
            while IFS= read -r -d '' path; do
              case "$path" in
                # Everything the chain builds from, and the e2e suite and the
                # workflows/actions that run it. The Nix and flake paths are
                # here because a change to the derivations is validated by
                # building what they produce and then generating against it,
                # which is a stronger check than building the `.so` alone. None
                # of these turns e2e on: on a pull request only the label does.
                android/*|rust/fedimint-sdk/*|rust/uniffi-bindgen/*|nix/*|flake.nix|flake.lock|scripts/nix-build-android-so.sh|scripts/generate-android-bindings.sh|scripts/build-android-sdk.sh|scripts/e2e-android/*|js/android/integration-tests/*|scripts/setup_test_shell.sh|scripts/devimint-modules.sh|.github/actions/setup-nix/*|.github/workflows/android-sdk.yaml|.github/workflows/android-native.yaml|.github/workflows/android-apk.yaml|.github/workflows/android-e2e.yml|.github/workflows/android-e2e-label.yml)
                  android=true
                  break
                  ;;
              esac
            done < "$changed_files"
          fi

          emit_outputs

  # The shared half. Builds nothing Kotlin-specific and uploads the `.so`
  # tree as the `jniLibs` artifact for the jobs below.
  native:
    name: 'Native library'
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android-native.yaml
    secrets: inherit

  # Reads the Kotlin out of the `.so`, once. `rust/uniffi-bindgen`'s only
  # dependency is `uniffi` itself, so this is a small host build — no NDK, no
  # cross-compile, no Nix; everything heavy was done by `native`. A job of its
  # own because two others need its output, `apk` and `aar`, and each
  # generating a copy would be the same work done twice, on two machines, for
  # the same file.
  bindings:
    name: 'Generate the Kotlin bindings'
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      bindings-artifact: android-bindings

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # jniLibs is a build output and gitignored, so it has to be put back
      # before uniffi-bindgen can read it.
      - name: 'Download jniLibs'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.native.outputs.jni-artifact }}
          path: android/fedimint-sdk/src/main/jniLibs/

      - name: 'Set up Rust'
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: 'Generate the Kotlin bindings'
        run: ./scripts/generate-android-bindings.sh

      - name: 'Upload Kotlin bindings'
        uses: actions/upload-artifact@v4
        with:
          name: android-bindings
          path: android/fedimint-sdk/src/main/java/org/fedimint/sdk/
          if-no-files-found: error

  # Assembles the example APK the E2E job installs, in the lean `.#android` shell
  # on a machine of its own: a Gradle build on the same machine as an
  # emulator and a devimint federation starved the emulator until Android's
  # System UI stopped responding, so the build happens where nothing else is
  # running. It is also the one place the example app is compiled against the
  # generated bindings — what proves they are usable from ordinary Kotlin, not
  # merely that they parse. A failure here fails the run, so `aar` below has
  # no need to compile the app a second time.
  apk:
    name: 'Assemble the Android example APK'
    needs: [native, bindings]
    uses: ./.github/workflows/android-apk.yaml
    with:
      jni-artifact: ${{ needs.native.outputs.jni-artifact }}
      bindings-artifact: ${{ needs.bindings.outputs.bindings-artifact }}
    secrets: inherit

  # Runs the example app on an emulator and drives it with Appium. Separate from
  # `aar` below, rather than another step of it, because the two answer
  # different questions — `aar` that the library packages into an AAR, this
  # one that it works on a device — and an emulator run has no business
  # holding up the AAR. It installs the APK `apk` built rather than building
  # its own; see that job for why. Gated by `changes`: the Mac it runs on is
  # the one machine of its kind, and both shapes take it in turn.
  e2e:
    name: 'Drive the Android example app on a device'
    needs: [changes, apk]
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/android-e2e.yml
    with:
      apk-artifact: ${{ needs.apk.outputs.apk-artifact }}
    secrets: inherit

  aar:
    name: 'Assemble the AAR'
    needs: [native, bindings]
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # jniLibs and the generated Kotlin are both build outputs and gitignored,
      # so both have to be put back before Gradle can see them. Neither is made
      # here: `native` built the .so and `bindings` read the Kotlin out of it.
      - name: 'Download jniLibs'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.native.outputs.jni-artifact }}
          path: android/fedimint-sdk/src/main/jniLibs/

      - name: 'Download the Kotlin bindings'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.bindings.outputs.bindings-artifact }}
          path: android/fedimint-sdk/src/main/java/org/fedimint/sdk/

      - name: 'Set up JDK'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 'Set up Gradle'
        uses: gradle/actions/setup-gradle@v4

      # Only the library. The example app is compiled — once — by `apk`,
      # against these same bindings.
      - name: 'Assemble the library'
        working-directory: android
        run: ./gradlew :fedimint-sdk:assembleRelease

      - name: 'Upload AAR'
        uses: actions/upload-artifact@v4
        with:
          name: fedimint-android-aar
          path: android/fedimint-sdk/build/outputs/aar/*.aar
          if-no-files-found: error

  # The one check branch protection requires from this workflow. It runs on
  # every pull request and merge group whatever they touched, so the check
  # always reports: a job `changes` skipped counts as a pass, one that failed
  # or was cancelled does not. `always()` rather than `!cancelled()`, so a
  # cancelled run reports a failure instead of a skip that would read as a pass.
  result:
    name: 'Android SDK result'
    needs: [changes, native, bindings, apk, e2e, aar]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: 'Check every Android job passed or was skipped'
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [[ -n "$failed" ]]; then
            echo "$failed" >&2
            exit 1
          fi
