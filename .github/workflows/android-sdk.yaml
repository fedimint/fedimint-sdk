name: Android SDK

# Generates the Kotlin bindings from the shared Android native library, then
# proves the whole chain builds: the AAR, and the example app compiled against
# the freshly generated bindings.
#
# Every task runs exactly once, and each job downloads what the one before it
# produced instead of redoing it:
#
#   native    cross-compiles the .so                    -> jniLibs
#   bindings  runs `uniffi-bindgen` against that .so    -> android-bindings
#   apk       Gradle: the example app's debug APK       -> android-example-apk
#   e2e       installs that APK on an emulator and drives it
#   kotlin    Gradle: the release AAR                   -> fedimint-android-aar
#
# The native `.so` is not built here. `android-native.yaml` builds it once and
# this workflow calls that, then runs `uniffi-bindgen` against the artifact it
# produced. Generating from the built binary rather than from the crate source
# is what makes the Kotlin and the library it loads impossible to get out of
# step — and it leaves the expensive cross-compile as one job that any other
# binding generator can call the same way.
#
# Nothing is published here. android-sdk-release.yaml and
# android-sdk-snapshot.yaml call this whole chain and publish the AAR only after
# every job in it has passed.
#
# A pull request starts this workflow whatever it changes. Its first job,
# `changes`, decides from the changed files whether the chain runs; a manual
# run and a call from a release workflow always run all of it. Its last job,
# `result`, is the one check to require, "Android SDK checks". It watches every
# other job but `e2e`: it passes when `changes` said to run and all of them
# succeeded, or `changes` said not to and all of them were skipped. It fails
# in every other case, a run that is cancelled before they have finished
# included. A run that is cancelled while only `e2e` is left does not change
# it.

on:
  workflow_dispatch:
  # For android-sdk-release.yaml and android-sdk-snapshot.yaml. After this
  # chain has passed, they reuse its jniLibs and bindings artifacts rather
  # than building their own, and assemble the published AAR from them.
  workflow_call:
    outputs:
      jni-artifact:
        description: 'Name of the uploaded jniLibs artifact'
        value: ${{ jobs.native.outputs.jni-artifact }}
      bindings-artifact:
        description: 'Name of the uploaded Kotlin bindings artifact'
        value: ${{ jobs.bindings.outputs.bindings-artifact }}
  # The single PR entry point for the Android chain. android-native.yaml has no
  # PR trigger of its own precisely so that the patterns of the `changes` job
  # below are the whole story: one run, one cross-compile, whatever the PR
  # touched. There is no `paths` filter here, because a workflow that does not
  # start reports nothing, and a check that never reports cannot be required.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# `contents: read` rather than `{}`: this workflow calls another one, and a
# called workflow can never hold more permissions than its caller grants. With
# no permissions at all the call is refused before the callee's jobs are ever
# created — which shows up as this workflow's own job being skipped, with no
# log to read anywhere.
permissions:
  contents: read

jobs:
  # Whether this pull request changes what the chain builds and tests. The
  # answer is `true` for any other event: a manual run and a call from a
  # release workflow run the whole chain. The action tests its matcher before
  # it answers, and a matcher that fails fails this job, and with it `result`.
  changes:
    name: 'Detect Android SDK changes'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changed.outputs.changed }}

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 'Match the changed files against what this workflow checks'
        id: changed
        uses: ./.github/actions/changed-paths
        with:
          # `*` also matches `/`.
          patterns: |
            android/*
            rust/fedimint-sdk/*
            rust/uniffi-bindgen/*
            # The Nix and flake paths: a change to the derivations is validated
            # by building what they produce and then generating against it,
            # which is a stronger check than building the `.so` alone.
            nix/*
            flake.nix
            flake.lock
            scripts/nix-build-android-so.sh
            scripts/generate-android-bindings.sh
            scripts/build-android-sdk.sh
            scripts/e2e-android/*
            # android-e2e.yml runs the suite through this, the same entry
            # point the browser package's tests use to stand a federation up.
            scripts/setup_test_shell.sh
            scripts/devimint-modules.sh
            js/android/integration-tests/*
            .github/workflows/android-sdk.yaml
            .github/workflows/android-native.yaml
            .github/workflows/android-apk.yaml
            .github/workflows/android-e2e.yml

  # The shared half. Builds nothing Kotlin-specific and uploads the `.so`
  # tree as the `jniLibs` artifact for the jobs below.
  native:
    name: 'Native library'
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/android-native.yaml
    secrets: inherit

  # Reads the Kotlin out of the `.so`, once. `rust/uniffi-bindgen`'s only
  # dependency is `uniffi` itself, so this is a small host build — no NDK, no
  # cross-compile, no Nix; everything heavy was done by `native`. A job of its
  # own because two others need its output, `apk` and `aar`, and each
  # generating a copy would be the same work done twice, on two machines, for
  # the same file.
  bindings:
    name: 'Generate the Kotlin bindings'
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      bindings-artifact: android-bindings

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # jniLibs is a build output and gitignored, so it has to be put back
      # before uniffi-bindgen can read it.
      - name: 'Download jniLibs'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.native.outputs.jni-artifact }}
          path: android/fedimint-sdk/src/main/jniLibs/

      - name: 'Set up Rust'
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: 'Generate the Kotlin bindings'
        run: ./scripts/generate-android-bindings.sh

      - name: 'Upload Kotlin bindings'
        uses: actions/upload-artifact@v4
        with:
          name: android-bindings
          path: android/fedimint-sdk/src/main/java/org/fedimint/sdk/
          if-no-files-found: error

  # Assembles the example APK the E2E job installs, in the lean `.#android` shell
  # on a machine of its own: a Gradle build on the same machine as an
  # emulator and a devimint federation starved the emulator until Android's
  # System UI stopped responding, so the build happens where nothing else is
  # running. It is also the one place the example app is compiled against the
  # generated bindings — what proves they are usable from ordinary Kotlin, not
  # merely that they parse. A failure here fails the run, so `aar` below has
  # no need to compile the app a second time.
  apk:
    name: 'Assemble the Android example APK'
    needs: [native, bindings]
    uses: ./.github/workflows/android-apk.yaml
    with:
      jni-artifact: ${{ needs.native.outputs.jni-artifact }}
      bindings-artifact: ${{ needs.bindings.outputs.bindings-artifact }}
    secrets: inherit

  # Runs the example app on an emulator and drives it with Appium. Separate from
  # `aar` below, rather than another step of it, because the two answer
  # different questions — `aar` that the library packages into an AAR, this
  # one that it works on a device — and an emulator run has no business
  # holding up the AAR. It installs the APK `apk` built rather than building
  # its own; see that job for why.
  e2e:
    name: 'Drive the Android example app on a device'
    needs: apk
    uses: ./.github/workflows/android-e2e.yml
    with:
      apk-artifact: ${{ needs.apk.outputs.apk-artifact }}
    secrets: inherit

  aar:
    name: 'Assemble the AAR'
    needs: [native, bindings]
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # jniLibs and the generated Kotlin are both build outputs and gitignored,
      # so both have to be put back before Gradle can see them. Neither is made
      # here: `native` built the .so and `bindings` read the Kotlin out of it.
      - name: 'Download jniLibs'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.native.outputs.jni-artifact }}
          path: android/fedimint-sdk/src/main/jniLibs/

      - name: 'Download the Kotlin bindings'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.bindings.outputs.bindings-artifact }}
          path: android/fedimint-sdk/src/main/java/org/fedimint/sdk/

      - name: 'Set up JDK'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 'Set up Gradle'
        uses: gradle/actions/setup-gradle@v4

      # Only the library. The example app is compiled — once — by `apk`,
      # against these same bindings.
      - name: 'Assemble the library'
        working-directory: android
        run: ./gradlew :fedimint-sdk:assembleRelease

      - name: 'Upload AAR'
        uses: actions/upload-artifact@v4
        with:
          name: fedimint-android-aar
          path: android/fedimint-sdk/build/outputs/aar/*.aar
          if-no-files-found: error

  # The one check to require. It passes only if `changes` answered `true` and
  # every other job it needs succeeded, or `changes` answered `false` (the pull
  # request touches nothing this workflow checks) and every other job it needs
  # was skipped. Anything else fails it.
  #
  # A skipped job is not accepted when `changes` answered `true`: GitHub skips
  # a job when a job it needs did not succeed, and also shows the call of a
  # refused reusable workflow as skipped, and branch protection counts a
  # skipped check as passed. Every job of the chain but `e2e` is watched, so
  # that the error names the job that broke it and not only the jobs skipped
  # after it.
  #
  # `e2e` is left out on purpose. The device run needs the one self-hosted Mac,
  # can wait hours for it and sometimes fails for reasons outside the change,
  # so it stays visible on the pull request without deciding whether it can
  # merge.
  #
  # `always()` makes the job start in a cancelled run too, where it sees the
  # cancelled jobs and fails. Without it the check would end as whatever
  # GitHub reports for a job that never started. That is `cancelled` today,
  # which does not pass either, but no documentation promises it. The run of a
  # commit that a newer commit replaced fails this way on the old commit only,
  # where it decides nothing.
  #
  # What the check is worth depends on its `needs`. A job of this workflow
  # that is not listed there decides nothing, as `e2e` does not, and one that
  # is listed with `continue-on-error: true` reads as succeeded when it fails.
  # A listed job with an `if:` of its own is skipped when the condition is
  # false, and this check then fails whenever `changes` answered `true`.
  result:
    name: 'Android SDK checks'
    needs: [changes, native, bindings, apk, aar]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      # The repository is only needed to read the local action below.
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Check that every job ended as it has to'
        uses: ./.github/actions/jobs-result
        with:
          needs: ${{ toJSON(needs) }}
          ran: ${{ needs.changes.outputs.run }}
