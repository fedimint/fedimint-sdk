name: iOS Native Library

# Builds `rust/fedimint-sdk`'s `uniffi` feature for the Apple targets and
# nothing else: the cross-compiled `libfedimint_sdk.a` per triple. No bindings
# of any language are generated here.
#
# It stands on its own for the same reason android-native.yaml does: the native
# library is the input every binding generator shares, and it is the expensive
# half (rocksdb and aws-lc are built from C, four times over). `swift-sdk.yaml`
# calls this workflow and then runs `uniffi-bindgen` against what it produced.
#
# Two things come out of a run:
#
#   * the `apple-slices` artifact, for whatever job needs the `.a` next, and
#   * warm Cachix entries, so nothing downstream compiles from source.
#
# The `-deps` derivations are pushed alongside the libraries themselves to cover
# the common case where a source edit misses the library cache but can still
# substitute the whole cross-compiled dependency tree.
#
# On sandboxing: these derivations are impure (`__noChroot = true`) because an
# Apple target compiles against an SDK that ships inside Xcode and cannot live
# in the nix store. That makes them unbuildable under a strict sandbox but
# leaves their outputs ordinary, substitutable store paths — hence
# `sandbox = relaxed` below, and hence Cachix works normally. See nix/ffi.nix
# for the one soundness caveat that comes with it.

on:
  # Callable so a binding workflow can build its own input rather than depending
  # on a previous run's artifacts having survived.
  workflow_call:
    outputs:
      slices-artifact:
        description: 'Name of the uploaded Apple slices artifact'
        value: ${{ jobs.build.outputs.slices-artifact }}

  workflow_dispatch:

  # On `main`, repopulate Cachix after anything that can invalidate the
  # cross-compile — including the crate itself, so a PR that merges without
  # having run this still lands warm.
  push:
    branches: [main]
    paths:
      - 'rust/fedimint-sdk/**'
      - 'rust/uniffi-bindgen/**'
      - 'nix/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'scripts/nix-build-ios-lib.sh'
      - '.github/workflows/ios-native.yaml'

  # Deliberately no `pull_request` trigger, matching android-native.yaml:
  # swift-sdk.yaml calls this workflow and covers the same paths, so a PR
  # trigger here would mean two cross-compiles of the same commit for any PR
  # that touched both a Nix file and something under ios/. As two separate
  # workflows they have different concurrency groups, so neither would cancel
  # the other. One PR entry point instead: whatever needs the `.a` asks for it.

concurrency:
  group: ios-native-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 'Cross-compile the Apple slices via Nix'
    # Apple Silicon, and it must be a macOS runner: every slice here compiles
    # against the SDK inside Xcode. Unlike android-native.yaml there is no
    # self-hosted mac with a persistent /nix/store, so a cold run downloads
    # everything from Cachix — fast once warm, a full source build when not.
    runs-on: macos-15
    timeout-minutes: 180
    outputs:
      slices-artifact: apple-slices

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Install Nix'
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          # `relaxed` is what lets a derivation opt out of the sandbox with
          # `__noChroot`. Without it these builds cannot see /usr/bin/clang or
          # the Xcode SDK and fail at the first C dependency.
          extra_nix_config: |
            sandbox = relaxed

      - name: 'Setup Cachix'
        uses: cachix/cachix-action@v17
        with:
          name: fedimint
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: 'Build per-target .a + deps'
        run: |
          nix build -L --accept-flake-config \
            .#fedimint-sdk-ios-aarch64-apple-ios \
            .#fedimint-sdk-ios-aarch64-apple-ios-sim \
            .#fedimint-sdk-ios-x86_64-apple-ios \
            .#fedimint-sdk-ios-aarch64-apple-darwin \
            .#fedimint-sdk-ios-aarch64-apple-ios-deps \
            .#fedimint-sdk-ios-aarch64-apple-ios-sim-deps \
            .#fedimint-sdk-ios-x86_64-apple-ios-deps \
            .#fedimint-sdk-ios-aarch64-apple-darwin-deps

      # The shared artifact: the per-triple archives plus the lipo'd simulator
      # slice and the manifest, laid out exactly as the plain-cargo producer
      # would leave them, so the consuming job needs no special handling.
      - name: 'Assemble the slice tree'
        run: ./scripts/nix-build-ios-lib.sh

      - name: 'Upload Apple slices'
        uses: actions/upload-artifact@v4
        with:
          name: apple-slices
          path: |
            rust/fedimint-sdk/target/*/release/libfedimint_sdk.a
            rust/fedimint-sdk/target/apple-slices.txt
          if-no-files-found: error

      - name: 'Push to Cachix'
        # cachix-action's post-run hook only pushes paths it saw *built*; on a
        # warm store nothing is ever "new", so the entries would quietly expire.
        # Push the outputs explicitly instead.
        continue-on-error: true
        run: |
          nix build --accept-flake-config --no-link --print-out-paths \
            .#fedimint-sdk-ios-aarch64-apple-ios \
            .#fedimint-sdk-ios-aarch64-apple-ios-sim \
            .#fedimint-sdk-ios-x86_64-apple-ios \
            .#fedimint-sdk-ios-aarch64-apple-darwin \
            .#fedimint-sdk-ios-aarch64-apple-ios-deps \
            .#fedimint-sdk-ios-aarch64-apple-ios-sim-deps \
            .#fedimint-sdk-ios-x86_64-apple-ios-deps \
            .#fedimint-sdk-ios-aarch64-apple-darwin-deps \
            .#fedimint-sdk-ios-bundle \
            | cachix push fedimint
