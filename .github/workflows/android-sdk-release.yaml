name: Android SDK Release

# Publishes the Android SDK, org.fedimint:sdk, to Maven Central
# through the Sonatype Central Portal.
#
# `version` holds the tag to the release rules of scripts/sdk-release.sh
# first, so a bad tag fails in seconds rather than after the whole chain.
# `chain` then runs the whole of android-sdk.yaml on the release commit: the
# native library, the bindings read out of it, the AAR, and the example app
# driven on an emulator.
# `publish` runs only if all of that passed. It reuses chain's tested inputs,
# the jniLibs and bindings artifacts, rather than building them again, and
# Gradle assembles the published AAR from them. So what is uploaded is a
# fresh AAR from the tested native libraries and bindings, not the archive
# chain assembled.
# `github-release` then creates the version's GitHub Release from its
# android/CHANGELOG.md section.
#
# The upload is published as soon as Central validates it (signatures, POM,
# sources and javadoc jars): the Gradle build uses
# `publishToMavenCentral(automaticRelease = true)`. The `publish` job waits
# until Central reports the version published, so a green run means the
# version is on Maven Central, and `github-release` runs only then. A
# deployment that fails validation fails the job with Central's reasons, and
# nothing is published. The approval of the `maven-central` environment is the
# decision to publish: nothing is uploaded before it, and a version published
# to Central can never be changed or deleted.
#
# If the wait runs out (SONATYPE_CLOSE_TIMEOUT_SECONDS in
# android/gradle.properties), the job fails although Central may still
# publish the version. Then check
# https://repo1.maven.org/maven2/org/fedimint/sdk/<version>/. If the POM is
# there, the release is out and only the GitHub Release is missing. Create it
# by hand with the notes from
# `scripts/sdk-changelog.sh release-notes android <version>`, as the
# `github-release` job would. Re-running the `publish` job cannot help then:
# Central refuses a version it has. If the POM is not there yet, the
# deployment under Publishing → Deployments on central.sonatype.com shows
# whether Central is still publishing it or why it failed.
#
# To release:
#
#   1. Run sdk-version-bump.yaml (Actions → SDK Version Bump) for `android`,
#      or for `bindings` or `all` to release other components with it. It
#      opens a pull request that sets `fedimintSdk` in
#      android/gradle/libs.versions.toml and writes the version's section in
#      android/CHANGELOG.md from the commits since the last release.
#   2. Optionally edit the notes in that pull request, then merge it.
#      sdk-tag.yaml then tags the merge commit `android-sdk-v<version>`
#      and starts this workflow on the tag.
#   3. Approve the `maven-central` environment when the run asks.
#
# RELEASING.md, at the repository root, describes the whole process, and
# which bump to pick. Pushing an `android-sdk-v*` tag by hand starts a release
# too, and the checks are the same either way.
#
# A manual run (workflow_dispatch) is a dry run by default. It runs the same
# chain, signs the artifacts and publishes them to a local Maven repository,
# which is uploaded as the `maven-central-dry-run` artifact for inspection.
# It may run on a branch, such as the one of a version bump pull request: the
# version in the tree is then checked as a release would, and a version that
# could not be released only warns. With `publish` ticked it publishes to
# Central like a tag push, and only from an `android-sdk-v*` tag. That is how
# sdk-tag.yaml starts a release, and how to re-run one whose tag
# already exists.
#
# Secrets, all four on the `maven-central` environment and none at
# repository level. Only jobs in that environment can read them, and only
# after its required reviewers approve. The environment must have required
# reviewers configured (Settings → Environments → maven-central): naming it
# here does not add any on its own.
#
#   MAVEN_CENTRAL_USERNAME       Central Portal user token, name part
#   MAVEN_CENTRAL_PASSWORD       Central Portal user token, secret part
#   MAVEN_SIGNING_KEY            ASCII-armored GPG private key
#                                (gpg --export-secret-keys --armor <key id>)
#   MAVEN_SIGNING_KEY_PASSWORD   its passphrase
#
# The key's public half must be on a keyserver Central checks, such as
# keys.openpgp.org, or validation fails.
#
# Snapshots are not part of this. android-sdk-snapshot.yaml publishes
# `<branch>-<commit>-SNAPSHOT` from whichever branch it is run on, by hand
# only.

on:
  push:
    tags:
      - 'android-sdk-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Maven Central (unticked: dry run into a local Maven repository)'
        type: boolean
        default: false

# Two releases in flight would race for the same version. Queue them and
# never cancel one partway through an upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    # Named so that `pipefail` is on, which the default shell leaves off.
    shell: bash

jobs:
  version:
    name: 'Check the version'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      # The whole history and every tag: the checks compare with the release
      # tags of every component and need origin/main to tell whether the
      # tagged commit is on it.
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # The catalog sets the version the artifacts are built with. This step
      # reads the version first: one that cannot be read fails the step at
      # once, with the message of scripts/sdk-version.sh and nothing else,
      # before any check or warning.
      #
      # scripts/sdk-release.sh holds the rules a release must pass, the same
      # ones sdk-tag.yaml applies before it tags; its header lists them.
      #
      # On a tag, pushed or started by hand, `check-tag` holds the tag to
      # them, so that an upload does not go out by mistake under a version
      # nobody tagged, nor from a commit that is not on main. It accepts the
      # release tag of any component, so the tag has to be an Android one
      # first, or a run on the tag of another component would build and
      # upload this one.
      #
      # A manual run on a branch is a dry run: `check` applies the rules to
      # the version in the tree. The dry run publishes nothing, so a version
      # that could not be released only warns. The pull request check,
      # `scripts/sdk-release.sh check-tree`, is what stops a bad version
      # before it is merged, and a dry run on the branch of a version bump
      # shows whether its release would go through.
      - name: 'Check the version'
        run: |
          scripts/sdk-version.sh current android >/dev/null
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != android-sdk-v* ]]; then
              echo "::error::$GITHUB_REF_NAME is not a tag of the Android SDK (android-sdk-v*);" \
                "run this workflow from one of its tags"
              exit 1
            fi
            scripts/sdk-release.sh check-tag "$GITHUB_REF_NAME"
          elif ! scripts/sdk-release.sh check android; then
            echo "::warning::the version in the tree could not be released as it is; see the" \
              "checks above. This dry run goes on because it publishes nothing. The pull" \
              "request check, scripts/sdk-release.sh check-tree, is what stops a bad version" \
              "before it is merged."
          fi

      # An upload has to come from a tag, so that the check above has a tag to
      # hold the version to. A tag push always does. A manual run may not.
      - name: 'Refuse to upload from a branch'
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_type != 'tag'
        run: |
          echo "::error::uploading to Maven Central needs an android-sdk-v* tag; run this" \
            "workflow from the tag, not from $GITHUB_REF_NAME"
          exit 1

  chain:
    name: 'Build and test'
    needs: version
    uses: ./.github/workflows/android-sdk.yaml
    secrets: inherit

  publish:
    name: ${{ (github.event_name == 'push' || inputs.publish) && 'Publish to Maven Central' || 'Dry run' }}
    needs: chain
    runs-on: ubuntu-24.04
    # Long enough for the setup and the build, and for the wait for Central to
    # publish the version, which lasts at most 50 minutes
    # (SONATYPE_CLOSE_TIMEOUT_SECONDS in android/gradle.properties).
    timeout-minutes: 75
    # The `maven-central` environment holds the Central token and the
    # signing key, and its required reviewers approve the upload. See the
    # secrets note at the top of this file.
    environment: maven-central

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Both are build outputs and gitignored, so both are put back from what
      # `chain` produced and tested.
      - name: 'Download jniLibs'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.chain.outputs.jni-artifact }}
          path: android/fedimint-sdk/src/main/jniLibs/

      - name: 'Download the Kotlin bindings'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.chain.outputs.bindings-artifact }}
          path: android/fedimint-sdk/src/main/java/org/fedimint/sdk/

      - name: 'Set up JDK'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 'Set up Gradle'
        uses: gradle/actions/setup-gradle@v4
        with:
          # A release build should not write a cache that later PR builds
          # would pick up.
          cache-read-only: true

      - name: 'Publish to Maven Central'
        if: github.event_name == 'push' || inputs.publish
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :fedimint-sdk:publishToMavenCentral

      - name: 'Dry run: publish to a local Maven repository'
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :fedimint-sdk:publishToMavenLocal -Dmaven.repo.local="$RUNNER_TEMP/m2"

      - name: 'Upload the dry-run repository'
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: maven-central-dry-run
          path: ${{ runner.temp }}/m2/org/fedimint/
          if-no-files-found: error

  # The version's GitHub Release, with its android/CHANGELOG.md section as the
  # notes, so the tag has a page saying what changed. It runs only after
  # `publish`, which waited for Central, so the version is on Maven Central by
  # then. A beta is marked as a pre-release. Re-running a release updates the
  # release's notes rather than failing.
  github-release:
    name: 'Create the GitHub Release'
    needs: publish
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Create or update the release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#android-sdk-v}"
          notes="$RUNNER_TEMP/notes.md"
          {
            # Each paragraph and list item on one line: a GitHub Release shows every line
            # break of its text, so the file's wrapping would show.
            scripts/sdk-changelog.sh release-notes android "$version"
            # The backticks are a Markdown code fence, not an expansion.
            # shellcheck disable=SC2016
            printf '\n```kotlin\nimplementation("org.fedimint:sdk:%s")\n```\n' "$version"
          } >"$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes"
            exit 0
          fi
          prerelease=()
          if [[ "$version" == *-beta.* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag "${prerelease[@]}" \
            --title "Android SDK $version" --notes-file "$notes"
