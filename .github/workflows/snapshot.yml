name: Snapshot

# On-demand snapshot release of the JS packages (web / wasm) from any branch.
# `changesets.yml` already cuts a `canary` snapshot on every push to `main`;
# this is the manual "publish a preview from my feature branch" companion, with
# the snapshot named after the branch and tagged `snapshot` on npm.
#
# The React Native binding build + artifact upload that used to live here went
# away with the RN CI — this only touches the wasm-backed packages.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Release snapshot version
    permissions:
      contents: read
      id-token: write
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build WASM
        uses: ./.github/actions/build-wasm
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Publish snapshot
        timeout-minutes: 15
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          nix develop --accept-flake-config -c bash -c '
            set -euo pipefail
            export CI=true

            # npm dist-tag / snapshot id: lowercase, alnum-and-dash only.
            snapshot=$(echo "$BRANCH" | tr -cs "[:alnum:]-" "-" | tr "[:upper:]" "[:lower:]" | sed "s/-\+$//")

            npm config set "//registry.npmjs.org/:_authToken" "$NPM_TOKEN"

            # `changeset version --snapshot` below exits 1 with "No unreleased
            # changesets found" when nothing is pending. This run was asked for
            # by a person, so say what they can act on instead of leaving them
            # that message to decode. Still a failure: a snapshot was requested
            # and none can be built. Keep this path in step with `.changeset` if
            # it ever moves. (The canary in `changesets.yml` fires on every push
            # rather than on request, so it skips this case instead.)
            if [ -z "$(find js/.changeset -maxdepth 1 -name "*.md" ! -name "README.md" -print -quit)" ]; then
              echo "No changeset pending on this branch; there is nothing to publish as a snapshot." >&2
              exit 1
            fi

            pnpm --dir js install
            pnpm --dir js changeset version --snapshot "$snapshot"
            pnpm --dir js build
            pnpm --dir js changeset publish --no-git-tag --tag snapshot
          '
