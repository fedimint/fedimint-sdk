name: Snapshot
on:
  workflow_dispatch:

jobs:
  snapshot:
    name: Release snapshot version
    permissions:
      contents: write
      id-token: write
    runs-on: macos-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build React Native Bindings
        uses: ./.github/actions/build-react-native

      - name: Build WASM
        uses: ./.github/actions/build-wasm

      # Upload artifacts to an immutable, commit-specific release tag FIRST
      # so the checksums computed during build will always match
      - name: Create immutable release tag
        id: release_tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH=$(git branch --show-current | tr -cs '[:alnum:]-' '-' | tr '[:upper:]' '[:lower:]' | sed 's/-$//')
          RELEASE_TAG="snapshot-${BRANCH}-${SHORT_SHA}"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $RELEASE_TAG"

      - name: Upload Artifacts to Immutable Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            packages/react-native-bindings/android-artifacts.zip
            packages/react-native-bindings/ios-artifacts.zip
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: 'Snapshot (${{ steps.release_tag.outputs.tag }})'
          prerelease: true

      # Also update the rolling "snapshot" tag for latest
      - name: Upload Artifacts to Snapshot Release (latest)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            packages/react-native-bindings/android-artifacts.zip
            packages/react-native-bindings/ios-artifacts.zip
          tag_name: snapshot
          name: Snapshot Release
          prerelease: true

      - name: Build all packages
        run: nix develop -c pnpm build

      - name: Publish Snapshot
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix develop -c bash -c "
          set -e
          branch=\$(git branch --show-current)
          snapshot=\$(echo \$branch | tr -cs '[:alnum:]-' '-' | tr '[:upper:]' '[:lower:]' | sed 's/-$//')
          npm config set '//registry.npmjs.org/:_authToken' '$NPM_TOKEN'

          pnpm changeset version --no-git-tag --snapshot \$snapshot

          # Re-apply checksums AFTER changeset version (which resets package.json)
          cd packages/react-native-bindings
          node -e \"const pkg = require('./package.json'); pkg.checksums={android:'${{ env.ANDROID_SHA256 }}',ios:'${{ env.IOS_SHA256 }}'}; require('fs').writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n')\"
          cd ../..

          pnpm build
          pnpm changeset publish --no-git-tag --snapshot \$snapshot --tag snapshot
          "
