name: Snapshot
on:
  workflow_dispatch:

jobs:
  build-rn-android:
    name: Build Android Bindings
    runs-on: [self-hosted, linux, x64]
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - id: build
        uses: ./.github/actions/build-rn-android
        timeout-minutes: 90

  build-rn-ios:
    name: Build iOS Bindings
    runs-on: macos-latest
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - id: build
        uses: ./.github/actions/build-rn-ios
        timeout-minutes: 120

  snapshot:
    name: Release snapshot version
    needs: [build-rn-android, build-rn-ios]
    permissions:
      contents: write
      id-token: write
    runs-on: macos-latest
    env:
      ANDROID_SHA256: ${{ needs.build-rn-android.outputs.sha256 }}
      IOS_SHA256: ${{ needs.build-rn-ios.outputs.sha256 }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: generated-bindings-android
          path: packages/react-native-bindings/

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: generated-bindings-ios
          path: packages/react-native-bindings/

      - name: Build WASM
        uses: ./.github/actions/build-wasm
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build all packages
        run: |
          nix develop --accept-flake-config -c bash -c "pnpm install && pnpm build"

      - name: Publish Snapshot
        timeout-minutes: 10
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix develop -c bash -c "
          set -e
          export CI=true
          branch=\$(git branch --show-current)
          snapshot=\$(echo \$branch | tr -cs '[:alnum:]-' '-' | tr '[:upper:]' '[:lower:]' | sed 's/-$//')
          npm config set '//registry.npmjs.org/:_authToken' '$NPM_TOKEN'

          pnpm changeset version --no-git-tag --snapshot \$snapshot

          # Re-apply checksums (action exported them to env)
          cd packages/react-native-bindings
          node -e \"const pkg = require('./package.json'); pkg.checksums={android:'${{ env.ANDROID_SHA256 }}',ios:'${{ env.IOS_SHA256 }}'}; require('fs').writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n')\"
          # This is required as the snapshot version is string is too long and considered invalid by the xcode.
          patch -p0 --forward < patches/snapshot_version.patch || true
          cd ../..

          pnpm build
          pnpm build:reactnative
          pnpm changeset publish --no-git-tag --snapshot \$snapshot --tag snapshot
          "

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            packages/react-native-bindings/android-artifacts.zip
            packages/react-native-bindings/ios-artifacts.zip
          tag_name: snapshot
          name: Snapshot Release
          prerelease: true
