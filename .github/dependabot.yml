version: 2

updates:
  - package-ecosystem: 'npm'
    directories:
      - '/js'
      - '/js/docs'
      - '/js/shared/*'
      - '/js/web/*'
      - '/js/react-native/*'
      - '/js/tools/*'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      npm:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      github-actions:
        patterns:
          - '*'
