[versions]
agp = "8.13.2"
kotlin = "2.0.21"
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
# 5.15.0 is the first release whose bundled libjnidispatch.so is 16 KB page
# aligned (net.java.dev.jna#1647). 5.14.0 trips Android 15's RELRO alignment
# check on 16 KB devices.
jna = "5.17.0"
coroutines = "1.8.1"
appcompat = "1.7.0"
material = "1.12.0"
lifecycle = "2.8.4"
# Reference wallet UI (android/app/DECISION.md). Chosen as the newest releases
# still built for Kotlin 2.0, so the pinned `kotlin` above needs no bump: a
# library compiled by a newer Kotlin carries metadata 2.0.21 cannot read.
composeBom = "2024.12.01"
activityCompose = "1.9.3"
navigationCompose = "2.8.5"
kotlinxSerialization = "1.7.3"
# QR codes for invoices, addresses and notes. Plain Java, so no Kotlin-version coupling.
zxing = "3.5.3"

# The Android SDK's own version, the one published to Maven Central. It is
# versioned independently of rust/fedimint-sdk/Cargo.toml. Releases are
# `X.Y.Z-beta.N` betas, then `X.Y.Z` itself; android-sdk-release.yaml refuses
# anything else. Snapshots are `<branch>-SNAPSHOT` and do not use this.
# Change it with the Android SDK Version Bump workflow rather than by hand;
# android/README.md's "Versioning" has the rules.
fedimintSdk = "0.1.0-beta.1"

# Publishes :fedimint-sdk to Maven Central through the Sonatype Central
# Portal (OSSRH is gone). 0.35.0 is the newest release that still supports
# this build's Gradle 8.13 and Kotlin 2.0; 0.36 needs Gradle 9 and Kotlin 2.2.
mavenPublish = "0.35.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# Demo app only.
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# JNA loads libfedimint_sdk.so and marshals across the UniFFI boundary.
# kotlinx-coroutines is the other dep the generated bindings need, not a
# convenience: async methods come out as `suspend fun` and the generated code
# imports kotlinx.coroutines itself. The demo additionally uses `-android`,
# for Dispatchers.Main.
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
# Since Kotlin 2.0 the Compose compiler ships with Kotlin, versioned with it.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Type-safe navigation routes are @Serializable classes.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
