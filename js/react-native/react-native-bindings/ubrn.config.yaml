# Read by `ubrn build android|ios` (scripts/generate-sdk-rn-bindings.sh,
# scripts/build-sdk-rn-ios.sh): where the crate is, what to name the turbo-module, where the
# generated code lands. `cargoExtras` names the crate feature that holds the UniFFI surface for
# the builds ubrn drives itself (iOS); the Android libraries come prebuilt from nix and are read
# with `--no-cargo`.
rust:
  directory: ../../../rust
  manifestPath: fedimint-sdk/Cargo.toml

bindings:
  name: FedimintReactNativeBindings
  cpp: cpp/generated
  ts: src/generated

android:
  javaPackage: com.fedimint.reactnative
  targets:
    - arm64-v8a
    - x86_64
  useSharedLibrary: true
  cargoExtras: ["--features", "uniffi"]

ios:
  tags: [ios]
  targets:
    - aarch64-apple-ios
    - aarch64-apple-ios-sim
    - x86_64-apple-ios
  cargoExtras: ["--features", "uniffi"]
