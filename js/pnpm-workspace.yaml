packages:
  - 'shared/*'
  - 'web/*'
  - 'react-native/*'
  - 'tools/*'
  - 'examples/*'
  - 'docs'

allowBuilds:
  # Appium's CLI works fine without its postinstall (verified with
  # `appium --version`); uiautomator2 is installed explicitly via
  # `appium driver install` at test-run time instead, not via this build
  # script. edgedriver/geckodriver are Selenium's Edge/Firefox driver
  # downloaders, pulled in transitively — irrelevant to Android/UiAutomator2
  # testing. All three left disabled; flip `appium` to true if a future
  # version's postinstall turns out to matter.
  appium: false
  edgedriver: false
  esbuild: true
  geckodriver: false
  secp256k1: true
  sharp: true
  simple-git-hooks: true
  vue-demi: true

overrides:
  'dom-serializer@2.0.0>entities': '4.4.0'
