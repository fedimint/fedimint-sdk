[package]
name = "fedimint-ubrn"
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"
authors = ["The Fedimint Developers"]
description = "Host-side uniffi-bindgen-react-native runner for fedimint-sdk"
repository = "https://github.com/fedimint/fedimint-sdk"
publish = false

# The command line of uniffi-bindgen-react-native (`ubrn`), which generates the React Native
# bindings in js/react-native/react-native-bindings and the browser binding in js/web/sdk-web.
# The tool's version is the one this crate's Cargo.lock pins: nix/web-bindgen.nix builds this
# crate into the dev shells the generation scripts run in.

[[bin]]
name = "ubrn"
path = "src/main.rs"

[dependencies]
clap = "4.6.0"

[dependencies.uniffi-bindgen-react-native]
# The `fedimint` branch of Fedimint's fork: the tool's `main` plus the changes Fedimint ships
# that upstream has not merged. Two of them are why the SDK needs the fork. One reads UniFFI 0.32
# metadata (jhugman/uniffi-bindgen-react-native#468): rust/fedimint-sdk links uniffi 0.32, and
# the released tool stops at 0.31. The other is jhugman/uniffi-bindgen-react-native#491, without
# which the generated TypeScript types the SDK's `Cursor` as the runtime's own `Cursor` class
# rather than a string. Cargo.lock records the commit, and
# `cargo update -p uniffi-bindgen-react-native` moves it to the branch's head.
git = "https://github.com/fedimint/uniffi-bindgen-react-native"
branch = "fedimint"
