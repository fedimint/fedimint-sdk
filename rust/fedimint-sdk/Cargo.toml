[package]
name = "fedimint-sdk"
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"
authors = ["The Fedimint Developers"]
description = "High-level Fedimint client SDK: one ergonomic API over fedimint-client, and the single surface every binding generates from"
repository = "https://github.com/fedimint/fedimint-sdk"
publish = false   # flip when the name is reserved and the API settles

[lib]
# `cdylib` is the shared library a mobile host loads, and the file
# uniffi-bindgen reads its metadata back out of to generate Kotlin/Swift;
# `staticlib` is the iOS/XCFramework form; `lib` is the ordinary Rust rlib.
#
# Cargo has no per-target crate-type, so these are built on every target. Only
# `cargo build` pays for the extra links — `check`, `clippy`, `test` and `doc`
# do not — which is where nearly all of this crate's CI time goes.
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# The UniFFI surface: `#[uniffi::export]` on the real methods plus the adapters in
# `src/ffi/`. Off by default so plain-Rust users compile none of it. The `uniffi` crate is
# declared once per target below, because the two hosts drive an exported `async fn`
# differently: a mobile host polls it from a foreign thread, so native needs `uniffi/tokio`
# (an `async-compat` context around every poll; see that entry) and the exports say
# `async_runtime = "tokio"`; a JavaScript host drives UniFFI's own future ABI from its event
# loop on a single thread, so wasm needs `wasm-unstable-single-threaded` (which drops the
# `Send + Sync` bounds the wasm client types cannot meet) and the exports carry no runtime.
# `uniffi-runtime-wasm` is the allocator and panic hook the wasm player calls into.
# `dep:async-compat` is what turns that entry (and its `multi-thread` feature) on: left out, the
# fallback runtime is current-thread and the first RocksDB transaction aborts the process.
uniffi = ["dep:uniffi", "dep:async-compat", "dep:uniffi-runtime-wasm"]

[dependencies]
# The SDK tracks fedimint `master`, not a published release. Every fedimint
# crate below is a git dependency pinned to one revision, and that revision
# must equal the one the repo's flake.nix pins for its `fedimint` and
# `fedimint-wasm` inputs: the client under test and the federation the tests
# run it against have to come from the same commit. Bump all three together;
# the `pins-agree` job in .github/workflows/rust-sdk-ci.yaml fails the build
# when they drift. Git dependencies also mean this crate cannot go to
# crates.io, which is what `publish = false` above already says.
#
# No foreign error-type crate may ever appear here — the public error surface
# is crate-owned (see fedimint/fedimint#8821 for the upstream structured-error
# work this stays decoupled from), which is also why `anyhow` is absent: the
# upstream calls that still return it are mapped where they are made.
fedimint-bip39 = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }
fedimint-client = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }
fedimint-client-module = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }
fedimint-connectors = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }
fedimint-core = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }
# `EventLogId` and the client's `get_event_log`/`log_event_added_rx` read positions in it, needed
# to scan for a walletv2 deposit's `ReceivePaymentEvent`; nothing already listed here re-exports
# it (`fedimint-client` only re-exports `EventHandlerError` from this crate).
fedimint-eventlog = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }
fedimint-ln-client = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }
fedimint-ln-common = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }
fedimint-lnv2-client = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }
fedimint-lnv2-common = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }
fedimint-meta-client = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }
fedimint-meta-common = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }
fedimint-mint-client = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }
# `MintClientModule` keeps its `MintClientConfig` (and the `FeeConsensus`/denomination
# rounding on it) private, and re-exports nothing that names the type from
# `fedimint-mint-client` itself, so reading the fee schedule at all means naming
# `MintClientConfig` at its own defining crate. Already resolved at the identical
# revision as a transitive dependency of `fedimint-mint-client`; this only makes it
# directly nameable, it does not change what's compiled.
fedimint-mint-common = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }
fedimint-mintv2-client = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }
# Named directly for the same reason as `fedimint-mint-common` above: a claim transaction's
# output amount is read off the concrete `mintv2_common::MintOutput` the client's own state
# store holds, and `MintClientConfig::fee_consensus` is only nameable through this crate.
# Already resolved at the identical revision as a transitive dependency of
# `fedimint-mintv2-client`.
fedimint-mintv2-common = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }
fedimint-wallet-client = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }
fedimint-wallet-common = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }
fedimint-walletv2-client = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }
fedimint-walletv2-common = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }

# `bip39` is named directly only to switch its `zeroize` feature on, which
# `fedimint-bip39` does not: features are unioned, so this is the same single
# copy of the crate `fedimint-bip39` uses, with one feature more. The version
# requirement is fedimint's own, so the two cannot drift apart into two
# `Mnemonic` types that look identical and are not. `zeroize` itself is for the
# entropy buffer `Mnemonic::generate` draws into.
bip39 = { version = "2.2.2", default-features = false, features = ["zeroize"] }
zeroize = "1"
futures = "0.3.32"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["arbitrary_precision"] }
tracing = "0.1.44"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Pinned to fedimint's `[workspace.dependencies]` version, and it must equal the `uniffi` that
# `rust/uniffi-bindgen` builds: the generator reads the metadata this version bakes into the
# built library, so a mismatch fails codegen. `tokio` is what makes
# `#[uniffi::export(async_runtime = "tokio")]` available.
uniffi = { version = "0.32.0", optional = true, features = ["tokio"] }
# Never named in the source: it is here only to turn on its `multi-thread` feature, which cargo
# unifies onto the copy `uniffi_core` depends on.
#
# UniFFI polls an exported async fn on whichever foreign thread drives the call,
# inside an `async_compat::Compat` that enters a process-wide fallback runtime.
# That fallback is current-thread by default, so anything the future *spawns* —
# for fedimint, the client's `sm-executor` task — lands on a current-thread
# scheduler, and the first `fedimint-rocksdb` transaction there aborts the
# process on `tokio::task::block_in_place`. The feature makes the fallback
# multi-threaded, which is the whole reason the exported methods need no
# runtime plumbing of their own.
#
# Pinned exactly: `multi-thread` first exists in 0.2.6, and this whole
# arrangement is temporary — it goes away with the pending uniffi change, at
# which point the dependency can be dropped rather than bumped.
async-compat = { version = "=0.2.6", optional = true, features = ["multi-thread"] }
# `fd-lock` rather than the `fs-lock` fedimint uses for the embedded store's own
# lock: this one is the SDK's single-opener claim, and it has to fail fast on
# contention rather than block. See src/storage.rs.
fd-lock = "4"
fedimint-rocksdb = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }
tokio = { version = "1.48.0", features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "macros",
    "time",
    # `net` + `io-util` give the runtime an IO driver to enable: fedimint-client's
    # transport runs on it, including under the UniFFI surface, where the runtime
    # is `async-compat`'s (see the `async-compat` entry above).
    "net",
    "io-util",
] }
socket2 = { version = "0.5", features = ["all"] }

[target.'cfg(target_os = "android")'.dependencies]
# Both of these are already in the graph underneath us — `hickory-resolver`
# pulls them in to read the platform's DNS configuration over JNI — and are
# named here only so `src/android.rs` can fill the handles that code reads.
# See that module for why nothing else fills them.
#
# `jni` is pinned to the same 0.22 line `hickory-resolver` uses rather than the
# newest available: two incompatible copies of it would compile, and then the
# `Context` published through one would be read back through the other.
jni = "0.22"
ndk-context = "0.1"
# Logging to logcat (src/android/logcat.rs): a Kotlin host cannot install a
# Rust subscriber, so on Android the SDK installs one itself. Neither adds a
# crate or a feature to the Android build — fedimint-logging already enables
# `fmt`, `env-filter` and the `log` bridge underneath us — they are named so
# this crate states what it relies on rather than inheriting it by accident.
tracing-log = { version = "0.2", default-features = false, features = ["log-tracer", "std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
    "std",
] }

[target.'cfg(target_family = "wasm")'.dependencies]
# Same version as the native entry above; see the `uniffi` feature for the split.
uniffi = { version = "0.32.0", optional = true, features = ["wasm-unstable-single-threaded"] }
# Exports `__ubrn_alloc`/`__ubrn_free` and the panic hook the wasm player installs before any
# SDK code runs. Nothing here calls it, so `src/lib.rs` force-links it with `extern crate`.
uniffi-runtime-wasm = { version = "0.31.0-5", optional = true }
fedimint-cursed-redb = { git = "https://github.com/fedimint/fedimint", rev = "1ab15e4b89aaa35727ca16e401d0cbc7d066de58" }
js-sys = "0.3.83"
# `macros` is not about tests here: `tokio::select!` lives behind it, and both
# subscription types select a stream against a shutdown watch on every target.
tokio = { version = "1.48.0", features = ["sync", "macros"] }
# Pinned exactly, matching fedimint's own `[workspace.dependencies]`: it has to
# agree with the `wasm-bindgen-cli` the nix build provides, and two versions of
# it in one graph do not link.
wasm-bindgen = "=0.2.106"
wasm-bindgen-futures = "0.4.56"
web-sys = { version = "0.3.83", features = [
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetFileOptions",
    "FileSystemSyncAccessHandle",
    "StorageManager",
    "WorkerGlobalScope",
    "WorkerNavigator",
] }

[build-dependencies]
# Only ever invoked on Android, to compile sdallocx_stub.c; see build.rs.
cc = "1"

# Tuned for the artifact this crate ships as on mobile: the `cdylib` goes
# inside an application's APK or IPA, where every megabyte is one the user
# downloads. Without these the Android library is ~82 MB per ABI; with them,
# ~61 MB — and AGP cannot strip it further, because the NDK's strip is not
# where it looks for it in the nix shell.
#
# `panic = "abort"` is also a correctness setting, not only a size one: the
# UniFFI response path must not unwind across the FFI boundary, which is the
# no-panic discipline the implementation notes in `src/lib.rs` spell out. Cargo
# ignores it for the test and bench profiles, so `cargo test --release` is
# unaffected.
#
# Profiles only apply when a package is the build root, so nothing here reaches
# a crate that depends on fedimint-sdk.
[profile.release]
opt-level = 'z'     # Optimize for size.
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
# Test-only: the library itself never names this crate (see the comment on `[dependencies]`
# above). It exists here solely so a unit test can build the exact wrapped error shape
# `fedimint-client` produces around a mint's failure, which cannot be built any other way.
anyhow = "1.0.104"
tempfile = "3.20.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "time"] }
