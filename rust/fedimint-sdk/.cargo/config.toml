# 16 KB page alignment for Android, matching fedimint-sdk-ffi's own
# .cargo/config.toml (fedimint/fedimint-sdk-ffi@cb8b157).
#
# Android 15 introduced devices with 16 KB pages rather than 4 KB. A library
# aligned to the old page size cannot be mapped directly on them — the loader
# takes a compatibility path and the system tells the user the app is not
# 16 KB compatible — and the Play Store requires 16 KB support for submissions
# targeting Android 15+.
#
# `max-page-size` is what aligns the loadable segments; `common-page-size`
# keeps the linker from padding between them as if pages were still 4 KB.
#
# This only applies when fedimint-sdk is the directory cargo is invoked from,
# which is what scripts/generate-android-so.sh does. Verify the result with:
#   llvm-readelf -l libfedimint_sdk.so | grep LOAD
# where every alignment should read 0x4000.
[target.'cfg(target_os = "android")']
rustflags = [
    "-C", "link-arg=-z",
    "-C", "link-arg=max-page-size=16384",
    "-C", "link-arg=-z",
    "-C", "link-arg=common-page-size=16384",
]
